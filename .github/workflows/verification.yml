name: Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  protected-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_protected_files.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/verify_features.py
      - run: python scripts/generate_progress.py --verify

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt ruff pyright
      - run: ruff check src tests
      - run: pyright src tests
      - run: python verify.py
