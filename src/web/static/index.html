<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovelForge Studio</title>
<!-- NovelForge's authoring surface opens on paper by default; an explicit dark
     preference remains opt-in and is preserved in localStorage. -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem('novelforge-theme')==='dark'?'dark':'light';}catch(_){document.documentElement.dataset.theme='light';}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e94560'/%3E%3Cpath d='M18 15h28v34H18z' fill='%23ffffff'/%3E%3Cpath d='M25 23h14M25 31h14M25 39h9' stroke='%23e94560' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js"></script>
<style>
:root{
--bg:#0d1117;--bg-card:#161b22;--bg-hover:#1c2128;--bg-elevated:#21262d;
--text:#e6edf3;--text-muted:#8b949e;--text-dim:#484f58;
--primary:#e94560;--primary-hover:#d63851;--primary-dim:rgba(233,69,96,.15);
--secondary:#21262d;--border:#30363d;--border-light:#3d444d;
--success:#3fb950;--warning:#d29922;--error:#f85149;--accent:#58a6ff;
--radius:12px;--radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.app{display:flex;height:100vh;overflow:hidden}
/* Sidebar */
.sidebar{width:248px;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:18px 20px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:19px;background:linear-gradient(135deg,#e94560,#58a6ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800}
.sidebar-header p{font-size:11px;color:var(--text-muted);margin-top:2px}
.sidebar-nav{flex:1;padding:10px;overflow-y:auto}
.nav-section{margin:14px 8px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-muted);transition:all .15s;margin-bottom:1px;font-size:13.5px;user-select:none}
.nav-item:hover{background:var(--bg-hover);color:var(--text)}
.nav-item.active{background:var(--primary-dim);color:var(--primary);font-weight:600}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success)}
.dot.off{background:var(--text-dim);box-shadow:none}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{padding:15px 26px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;min-height:60px}
.header h2{font-size:18px;font-weight:700}
.header .sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.content{flex:1;overflow-y:auto;padding:24px 26px}
.content-narrow{max-width:820px}
/* Buttons */
.btn{padding:8px 15px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-secondary{background:var(--secondary);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn-ghost{background:transparent;color:var(--text-muted)}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:transparent;color:var(--error);border:1px solid var(--border)}
.btn-danger:hover{background:rgba(248,81,73,.12);border-color:var(--error)}
/* Cards */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card-hover{transition:all .15s;cursor:pointer}
.card-hover:hover{border-color:var(--accent);transform:translateY(-2px)}
.card h3{font-size:15px;margin-bottom:12px;font-weight:700}
.card-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-title-row h3{margin-bottom:0}
/* Inputs */
.field{margin-bottom:16px}
.field label{display:block;margin-bottom:6px;color:var(--text-muted);font-size:12.5px;font-weight:500}
.input{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13.5px;font-family:inherit;transition:border-color .15s}
.input:focus{outline:none;border-color:var(--accent)}
.textarea{min-height:110px;resize:vertical;line-height:1.6}
select.input{cursor:pointer}
/* Layout */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.wizard-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.wizard-step-list{max-height:68vh;overflow:auto;position:sticky;top:16px}
.wizard-step{width:100%;display:flex;align-items:center;gap:9px;border:0;border-radius:8px;background:transparent;color:var(--text);padding:9px 8px;text-align:left;cursor:pointer;font:inherit;font-size:13px}
.wizard-step:hover,.wizard-step.active{background:var(--bg-hover)}
.wizard-step.active{box-shadow:inset 3px 0 var(--primary);color:var(--primary)}
.wizard-step-number{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--secondary);color:var(--text-muted);font-size:11px;flex:0 0 auto}
.wizard-step-number.done{background:rgba(63,185,80,.18);color:var(--success)}
.wizard-step-status{margin-left:auto;color:var(--text-dim);font-size:11px;white-space:nowrap}
.wizard-kicker{color:var(--primary);font-size:12px;font-weight:700;margin-bottom:8px}
.wizard-question{display:flex;gap:10px;padding:12px 14px;background:rgba(88,166,255,.08);border-left:3px solid var(--accent);border-radius:6px;line-height:1.6;color:var(--text-muted)}
.wizard-suggestion{padding:14px;border:1px solid rgba(88,166,255,.35);background:rgba(88,166,255,.06);border-radius:8px;line-height:1.7}
.row{display:flex;gap:10px;align-items:center}
.row-wrap{flex-wrap:wrap}
.spacer{flex:1}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge-success{background:rgba(63,185,80,.16);color:var(--success)}
.badge-warning{background:rgba(210,153,34,.16);color:var(--warning)}
.badge-error{background:rgba(248,81,73,.16);color:var(--error)}
.badge-info{background:rgba(88,166,255,.16);color:var(--accent)}
.badge-muted{background:var(--secondary);color:var(--text-muted)}
/* Progress */
.progress{height:6px;background:var(--secondary);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),#58a6ff);transition:width .4s;border-radius:3px}
/* Stat */
.stat-card{text-align:center;padding:22px}
.stat-value{font-size:30px;font-weight:800;color:var(--primary)}
.stat-value.accent{color:var(--accent)}
.stat-value.success{color:var(--success)}
.stat-label{color:var(--text-muted);margin-top:6px;font-size:12.5px}
/* Table */
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
.table th{color:var(--text-muted);font-weight:600;font-size:12px}
.table tr:hover td{background:var(--bg-hover)}
.chapter-row{cursor:pointer}
.chapter-row.selected td{background:rgba(233,69,96,.08)}
.workspace-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.workspace-section{padding-top:12px;margin-top:12px;border-top:1px solid var(--border);font-size:12.5px;line-height:1.7}
.workspace-section ul{margin:6px 0 0 18px;color:var(--text-muted)}
.score-chart{display:flex;flex-direction:column;gap:9px;padding:8px 0;max-height:420px;overflow:auto}
.score-row{display:grid;grid-template-columns:62px minmax(80px,1fr) 54px 78px;align-items:center;gap:10px;font-size:12px}
.score-chapter,.score-words{color:var(--text-muted)}
.score-track{height:9px;background:var(--secondary);border-radius:8px;overflow:hidden}
.score-fill{display:block;height:100%;border-radius:8px;transition:width .3s ease}
.review-score-large{font-size:42px;font-weight:800;line-height:1}.review-score-large small{font-size:13px;font-weight:500;color:var(--text-muted)}
.mindmap-shell{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.mindmap-root{max-width:560px;margin:0 auto 18px;padding:16px 20px;border:1px solid var(--primary);border-radius:12px;background:var(--primary-dim);text-align:center}
.mindmap-root-mark{display:block;color:var(--primary);font-size:11px;font-weight:700;margin-bottom:5px}.mindmap-root p{margin:6px 0 0;color:var(--text-muted);font-size:12px}
.mindmap-groups{display:grid;gap:16px}.mindmap-group{border-top:1px solid var(--border);padding-top:14px}.mindmap-group-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--text-muted);font-size:12px;font-weight:700}
.mindmap-node-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.mindmap-node{min-height:104px;padding:12px;text-align:left;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:5px}.mindmap-node:hover{border-color:var(--accent);transform:translateY(-1px)}.mindmap-node b{font-size:13px}.mindmap-node span:last-child{color:var(--text-muted);font-size:11.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.mindmap-node-kind{color:var(--primary);font-size:10px;text-transform:uppercase}
.timeline-list{max-width:920px;margin:0 auto;position:relative}.timeline-list:before{content:'';position:absolute;left:18px;top:12px;bottom:12px;width:2px;background:var(--border)}.timeline-item{position:relative;padding-left:52px}.timeline-marker{position:absolute;left:7px;top:18px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:#fff;font-size:11px;font-weight:700;z-index:1}.timeline-item .card{margin-bottom:12px}.plot-group{border-top:1px solid var(--border);padding-top:10px;margin-top:10px}.plot-group-title{display:flex;justify-content:space-between;color:var(--text-muted);font-size:12px;font-weight:700;margin-bottom:6px}.plot-node{display:flex;flex-direction:column;gap:4px;width:100%;padding:9px 10px;margin-bottom:6px;text-align:left;border:1px solid transparent;border-radius:7px;background:var(--bg);color:var(--text);cursor:pointer;font:inherit}.plot-node:hover{border-color:var(--accent)}.plot-node b{font-size:12.5px}.plot-node span{color:var(--text-muted);font-size:11.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* Empty */
.empty-state{text-align:center;padding:70px 20px;color:var(--text-muted)}
.empty-state svg{width:60px;height:60px;margin-bottom:16px;opacity:.25}
.empty-state h2{font-size:17px;margin-bottom:8px;color:var(--text)}
/* Spinner */
.loading{display:flex;align-items:center;justify-content:center;padding:44px;gap:12px;color:var(--text-muted)}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(2px)}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:640px;width:92%;max-height:86vh;overflow-y:auto}
.modal-lg{max-width:900px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-header h3{font-size:17px}
.close-x{cursor:pointer;color:var(--text-muted);font-size:22px;line-height:1;background:none;border:none}
.close-x:hover{color:var(--text)}
/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:0;flex-wrap:wrap}
.tab{padding:8px 15px;cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
/* Toast */
.toast-wrap{position:fixed;top:18px;right:18px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:var(--radius-sm);background:var(--bg-elevated);border:1px solid var(--border);border-left:3px solid var(--accent);min-width:260px;max-width:380px;font-size:13px;animation:slidein .25s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--error)}
.toast.warning{border-left-color:var(--warning)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
/* Misc */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--secondary);border-radius:20px;font-size:12px;margin:2px}
.divider{height:1px;background:var(--border);margin:16px 0}
.mono{font-family:'SF Mono',Consolas,monospace;font-size:12.5px}
.scroll-y{overflow-y:auto}
.text-muted{color:var(--text-muted)}
.text-sm{font-size:12.5px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.dim-note{font-size:12px;color:var(--text-dim);line-height:1.5}
.warn-banner{background:rgba(210,153,34,.12);border:1px solid rgba(210,153,34,.3);color:var(--warning);padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;line-height:1.5;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start}
.info-banner{background:rgba(88,166,255,.10);border:1px solid rgba(88,166,255,.28);color:var(--text);padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;line-height:1.5;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gate-box{display:flex;gap:10px;margin:10px 0}
.gate{flex:1;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);text-align:center}
.gate.pass{border-color:var(--success);background:rgba(63,185,80,.08)}
.gate.fail{border-color:var(--error);background:rgba(248,81,73,.08)}
.gate .g-label{font-size:11px;color:var(--text-muted)}
.gate .g-val{font-size:18px;font-weight:700;margin-top:4px}
.mermaid-box{background:#fff;border-radius:var(--radius);padding:16px;overflow:auto}
.log-line{padding:5px 10px;border-radius:6px;font-size:12.5px;margin-bottom:3px;font-family:'SF Mono',Consolas,monospace;background:var(--bg);border-left:2px solid var(--border)}
.log-line.active{border-left-color:var(--accent);background:var(--primary-dim)}
.timeline-wrap{position:relative;padding-left:24px}
.timeline-wrap::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-node{position:relative;margin-bottom:18px}
.tl-node::before{content:'';position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid var(--bg)}
.editor-layout{display:grid;grid-template-columns:1fr 320px;gap:16px}
@media(max-width:1100px){.editor-layout{grid-template-columns:1fr}.wizard-layout{grid-template-columns:1fr}.wizard-step-list{position:static;max-height:260px}.grid-4{grid-template-columns:repeat(2,1fr)}}
.score-ring{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv span{color:var(--text-muted)}
.kv b{color:var(--text);text-align:right}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.list-row:last-child{border-bottom:none}
.muted{color:var(--text-muted)}
.book-card{cursor:pointer;transition:all .15s}
.book-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.book-cover{width:100%;height:88px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary-dim),rgba(88,166,255,.15));display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:var(--primary);margin-bottom:12px}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px}
.fld{display:block;margin-bottom:14px;font-size:12.5px;color:var(--text-muted);font-weight:500}
.fld .input,.fld .ta{margin-top:6px}
.ta{min-height:90px;resize:vertical;line-height:1.6;width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13.5px;font-family:inherit}
.prog{height:8px;background:var(--secondary);border-radius:4px;overflow:hidden;margin-bottom:6px}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--primary),#58a6ff);transition:width .4s;border-radius:4px}
.log-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;height:220px;overflow-y:auto;font-size:12px}
.node-tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--secondary);font-size:11px;margin-left:6px}
.fs-card{border-left:3px solid var(--accent);padding:12px 14px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:10px}
.fs-card.planted{border-left-color:var(--warning)}
.fs-card.paid{border-left-color:var(--success)}
.planning-gate{align-items:flex-start}
.planning-gate-content{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.planning-gate-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.task-detail-modal .kv{align-items:flex-start}
.task-detail-modal .kv span{flex:0 0 90px}
.task-detail-modal .kv b{flex:1;max-width:none;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}
.task-kv-value{flex:1;min-width:0;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.task-run{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-top:12px;background:var(--bg)}
.task-run:first-child{margin-top:0}
.task-run-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.task-run-section{margin-top:10px}
.task-run-label{color:var(--text-muted);font-size:12px;font-weight:700;margin-bottom:6px}
.task-prompt{margin:0;padding:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);font:12.5px/1.65 'SF Mono',Consolas,monospace;white-space:pre-wrap;overflow:auto;max-height:360px;text-align:left}
.task-output{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;background:var(--bg-card);max-height:560px;overflow:auto;text-align:left}
.markdown-body{font-size:13.5px;line-height:1.8;text-align:left;overflow-wrap:anywhere}
.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{margin:14px 0 8px;line-height:1.35}
.markdown-body h1{font-size:20px}.markdown-body h2{font-size:17px}.markdown-body h3{font-size:15px}.markdown-body h4{font-size:14px}
.markdown-body p{margin:8px 0}.markdown-body ul,.markdown-body ol{margin:8px 0 8px 22px}.markdown-body li{margin:3px 0}
.markdown-body blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--accent);color:var(--text-muted);background:rgba(88,166,255,.06)}
.markdown-body pre{margin:10px 0;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:auto;text-align:left}
.markdown-body code{font-family:'SF Mono',Consolas,monospace;font-size:.92em}.markdown-body :not(pre)>code{padding:2px 5px;background:var(--secondary);border-radius:4px}
.markdown-body a{color:var(--accent);text-decoration:underline}

<script>
if(window.mermaid) mermaid.initialize({startOnLoad:false,theme:'default',securityLevel:'loose',flowchart:{curve:'basis'}});

// ===== State =====
const ACTIVE_BOOK_KEY='novelforge-active-book';
const ACTIVE_PAGE_KEY='novelforge-active-page';
const WRITE_TASK_KEY='novelforge-write-task-';
const NAV_STATE_KEY='novelforge-nav-state';
let storedNavState={};
try{storedNavState=JSON.parse(localStorage.getItem(NAV_STATE_KEY)||'{}')||{};}catch(_){storedNavState={};}
const S = {
  page:localStorage.getItem(ACTIVE_PAGE_KEY)||'dashboard',
  book:localStorage.getItem(ACTIVE_BOOK_KEY),
  books:[],
  tab:{},
  sse:null,
  activeTasks:{},
  expandedBooks:storedNavState.expandedBooks||{},
  expandedExtensions:storedNavState.expandedExtensions||{},
};
const IS_FILE_PREVIEW=window.location.protocol==='file:';

// ===== Nav definition =====
const NAV = [
  {sec:'创作'},
  {id:'dashboard',label:'我的创作',icon:'M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z'},
  {id:'create',label:'新建作品',icon:'M12 5v14M5 12h14'},
  {id:'chat',label:'AI 助手',icon:'M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z'},
  {id:'agent-config',label:'AI 配置',icon:'M4 5h16v14H4z M8 9h8 M8 13h5 M8 17h8'},
  {id:'book',label:'作品概览',icon:'M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z',bookOnly:true},
  {id:'wizard',label:'世界观向导',icon:'M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 17l-6.3 4.4L8 14 2 9.4h7.6z',bookOnly:true},
  {id:'chapters',label:'章节工作台',icon:'M4 19.5A2.5 2.5 0 016.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z',bookOnly:true},
  {id:'continuous',label:'连续创作',navGroup:'创作与审查',icon:'M5 3l14 9-14 9V3z',bookOnly:true},
  {id:'mindmap',label:'思维导图',navGroup:'规划与结构',icon:'M18 8a3 3 0 10-6 0 M6 12a3 3 0 106 0 M18 16a3 3 0 10-6 0 M9 12h6 M15 8l-3 4 3 4',bookOnly:true},
  {id:'storyflow',label:'StoryFlow 故事画布',navGroup:'规划与结构',icon:'M5 5h5v5H5z M14 14h5v5h-5z M10 7h4v10h-4z',bookOnly:true},
  {id:'simulation',label:'叙事模拟',navGroup:'规划与结构',icon:'M5 3h14v14H5z M8 7h8 M8 11h5 M18 17l3 3 M21 17l-3 3',bookOnly:true},
  {id:'timeline',label:'故事时间轴',navGroup:'规划与结构',icon:'M12 8v4l3 3 M12 2a10 10 0 100 20 10 10 0 000-20z',bookOnly:true},
  {id:'plot',label:'剧情工作流',navGroup:'规划与结构',icon:'M5 5h5v5H5z M14 14h5v5h-5z M10 7h4v10h-4z',bookOnly:true},
  {id:'world-map',label:'世界地图',navGroup:'规划与结构',icon:'M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z M9 3v15 M15 6v15',bookOnly:true},
  {id:'foreshadowing',label:'伏笔与钩子',navGroup:'规划与结构',icon:'M9 18V5l12-2v13 M6 15a3 3 0 100 6 3 3 0 000-6z M18 13a3 3 0 100 6 3 3 0 000-6z',bookOnly:true},
  {id:'characters',label:'人物关系',navGroup:'规划与结构',icon:'M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2 M9 11a4 4 0 100-8 4 4 0 000 8 M23 21v-2a4 4 0 00-3-3.87 M16 3.13a4 4 0 010 7.75',bookOnly:true},
  {id:'analytics',label:'数据分析',navGroup:'创作与审查',icon:'M18 20V10 M12 20V4 M6 20v-6',bookOnly:true},
  {id:'jointreview',label:'联合审查',navGroup:'创作与审查',icon:'M9 11l3 3L22 4 M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11',bookOnly:true},
  {id:'truth',label:'真相文件',navGroup:'规划与结构',icon:'M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6',bookOnly:true},
  {id:'forecast',label:'剧情推演',navGroup:'创作与审查',icon:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z M12 9a3 3 0 100 6 3 3 0 000-6z',bookOnly:true},
  {id:'export',label:'导出交付',navGroup:'交付',icon:'M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4 M7 10l5 5 5-5 M12 15V3',bookOnly:true},
  {sec:'系统'},
  {id:'tasks',label:'任务管理',navGroup:'创作与审查',icon:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2 M9 3h6a2 2 0 012 2v0a2 2 0 01-2 2H9a2 2 0 01-2-2v0a2 2 0 012-2z',bookOnly:true},
  {id:'genres',label:'题材库',icon:'M4 19.5A2.5 2.5 0 016.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z'},
  {id:'settings',label:'全局创作参数',icon:'M12 20h9 M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z'},
  {id:'import',label:'导入中心',icon:'M12 3v12 M8 11l4 4 4-4 M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4'},
  {id:'doctor',label:'系统诊断',icon:'M22 12h-4l-3 9L9 3l-3 9H2'},
];

const globalSettingsNav = NAV.find((item) => item.id === 'settings');
if (globalSettingsNav) globalSettingsNav.label = '全局创作参数';

// The historical visualization entries remain in NAV for muscle memory and
// deep-link compatibility, but they now resolve to a projection of the one
// SQLite-backed Story Graph. Keep this mapping in the base router so clicks
// made before the StoryFlow module finishes loading cannot render a second
// visualization source for one frame and then silently switch later.
const STORYFLOW_COMPAT_ROUTES = Object.freeze({
  mindmap: 'story',
  flow: 'story',
  timeline: 'timeline',
  plot: 'story',
  'world-map': 'world',
  foreshadowing: 'foreshadow',
  characters: 'character',
});

function routeStoryFlowCompatibility(page, focus = '') {
  const view = STORYFLOW_COMPAT_ROUTES[page];
  if (!view) return false;
  window.__storyflowRouteIntent = {
    view,
    focus: focus || '',
    sourcePage: page,
  };
  S.page = 'storyflow';
  localStorage.setItem(ACTIVE_PAGE_KEY, 'storyflow');
  if (S.book) S.expandedExtensions[S.book] = true;
  persistNavState();
  renderNav();
  render();
  return true;
}

// ===== Model work visibility =====
// Every UI entry point that can reach a text/image model is surfaced here.
// Queued work uses the durable TaskRuntime percentage; synchronous model
// requests intentionally use an indeterminate bar because the provider does
// not expose token-level progress at this HTTP boundary.
const MODEL_TASK_TYPES = new Set([
  'chat', 'world-bootstrap', 'write', 'write-next', 'draft-chapter', 'audit-chapter', 'review', 'review-chapter',
  'revise', 'revise-chapter', 'rewrite-chapter', 'plan-chapter', 'compose-chapter', 'continuous',
  'joint-review', 'planning-synthesis', 'planning-views-generate', 'forecast', 'thought-clarify',
  'thought-framework', 'story-bible-suggest', 'model-connection-test', 'model-discovery', 'radar-scan', 'translation-run',
  'draft-import-analysis', 'draft-import-adjustment-plan', 'interactive-film-generate',
  'interactive-film-node-image', 'cover-image-generate',
]);

const modelWork = (() => {
  const items = new Map();
  let sequence = 0;
  let restoredScope = null;
  const collapsedKey = 'novelforge-model-work-collapsed';
  let collapsed = false;
  try { collapsed = window.localStorage.getItem(collapsedKey) === '1'; } catch (_) {}

  const activeStatuses = new Set(['queued', 'pending', 'running', 'waiting_on_child', 'paused', 'cancelling']);
  const terminalStatuses = new Set(['completed', 'failed', 'cancelled', 'needs_author_decision']);

  function routeLabel(method, path, body) {
    if (String(method || '').toUpperCase() !== 'POST') return '';
    const route = String(path || '').split('?')[0];
    if (/\/chat$/.test(route)) return 'AI 助手正在整理回复';
    if (/\/wizard\/steps\/[^/]+\/generate$/.test(route)) return '正在生成向导建议';
    if (/\/wizard\/publish$/.test(route)) return '正在发布 Story Bible 并整理结构';
    if (/\/wizard$/.test(route)) return '正在构建世界观';
    if (/\/dialogue\/write$/.test(route)) return '正在生成角色对白';
    if (/\/story-bible\/steps\/[^/]+\/suggest$/.test(route)) return '正在生成 Story Bible 建议';
    if (/\/planning-summary\/generate$/.test(route)) return '正在理解规划资料';
    if (/\/planning-views\/generate$|\/planning-sources\/(?:complete|prepare)$/.test(route)) return '正在整理规划视图';
    if (/\/thought-session\/respond$/.test(route)) return '正在追问创作念头';
    if (/\/thought-session\/framework$/.test(route)) return '正在整理小说框架';
    if (/\/write-next$|\/draft$/.test(route)) return '正在规划并生成章节';
    if (/\/audit\/\d+$|\/chapters\/\d+\/review$/.test(route)) return '正在审查章节质量';
    if (/\/revise\/\d+$|\/rewrite\/\d+$/.test(route)) return '正在修订章节';
    if (/\/plan$|\/compose$/.test(route)) return '正在准备章节上下文';
    if (/\/continuous$/.test(route)) return '正在连续创作';
    if (/\/joint-review(?:-sync)?$/.test(route)) return '正在进行联合审查';
    if (/\/forecast$/.test(route)) return '正在推演剧情分支';
    if (/\/radar\/scan$/.test(route)) return '正在扫描题材趋势';
    if (/\/services\/[^/]+\/test$/.test(route)) return '正在测试模型连接';
    if (/\/services\/[^/]+\/models\/discover$/.test(route)) return '正在获取模型列表';
    if (/\/translations\/[^/]+\/run$/.test(route)) return '正在翻译文本';
    if (/\/draft-imports(?:\/[^/]+\/(?:retry|adjustment-plan|prepare-planning))?$/.test(route)) return '正在分析初稿';
    if (/\/projects\/[^/]+\/story-graph\/generate$/.test(route)) return '正在生成互动影像图谱';
    if (/\/projects\/[^/]+\/nodes\/[^/]+\/image$/.test(route)) return '正在生成节点配图';
    if (/\/books\/[^/]+\/cover\/generate$/.test(route)) return '正在生成封面图片';
    if (/\/interactive-films$/.test(route) && body?.brief) return '正在生成互动影像图谱';
    if (/\/books\/create$/.test(route) && body?.brief && body?.creationMode !== 'thought') return '正在初始化世界观';
    if (/\/(?:fanfic|spinoff|imitation)\/init$/.test(route)) return '正在初始化衍生作品';
    return '';
  }

  function taskIdValues(value, key = '', result = []) {
    if (typeof value === 'string' && /(?:^|_)taskId$|TaskId$/.test(key) && value) {
      result.push(value);
      return result;
    }
    if (!value || typeof value !== 'object') return result;
    if (Array.isArray(value)) {
      value.forEach((item) => taskIdValues(item, key, result));
      return result;
    }
    Object.entries(value).forEach(([childKey, childValue]) => taskIdValues(childValue, childKey, result));
    return result;
  }

  function taskProgress(task) {
    const raw = task?.progressPercent ?? task?.progress;
    const value = Number(raw);
    return Number.isFinite(value) ? Math.max(0, Math.min(100, Math.round(value))) : null;
  }

  function taskLabel(task, fallback) {
    if (fallback) return fallback;
    if (typeof taskTypeLabel === 'function') return taskTypeLabel(task?.type, task);
    return task?.displayName || task?.type || '模型任务';
  }

  function taskStage(task) {
    if (!task) return '模型请求处理中';
    if (typeof taskStageLabel === 'function') return taskStageLabel(task.stage || task.checkpoint?.stage, task.status);
    return task.stage || task.status || '处理中';
  }

  function taskStatus(task) {
    if (!task) return '模型请求处理中';
    if (task.status === 'queued' || task.status === 'pending') return '等待 Worker 领取';
    if (task.status === 'paused') return '已暂停，等待恢复';
    if (task.status === 'cancelling') return '正在安全取消';
    if (task.status === 'failed') return '处理失败';
    if (task.status === 'needs_author_decision') return '等待作者决定';
    if (task.status === 'completed') return '已完成';
    return taskStage(task);
  }

  function determinate(task, progress) {
    if (!task) return false;
    if (task.status === 'queued' || task.status === 'pending' || task.status === 'completed') return progress !== null;
    const stage = task.stage || task.checkpoint?.stage;
    return progress !== null && progress > 0 && stage && !['running', 'queued'].includes(stage);
  }

  function renderInline(task, label, options = {}) {
    const progress = taskProgress(task);
    const isDeterminate = determinate(task, progress);
    const width = progress === null ? 0 : progress;
    const compact = options.compact ? ' model-work-inline-compact' : '';
    const progressText = isDeterminate ? `${progress}%` : (task?.status === 'queued' || task?.status === 'pending' ? '等待领取' : '处理中');
    return `<div class="model-work-inline${compact}">
      <div class="model-work-inline-head"><b>${esc(label || taskLabel(task))}</b><span>${esc(taskStatus(task))}</span></div>
      <div class="model-work-track"><div class="model-work-fill${isDeterminate ? '' : ' is-indeterminate'}" style="width:${isDeterminate ? width : 36}%"></div></div>
      <div class="model-work-inline-foot"><span>${esc(taskStage(task))}</span><span>${progressText}</span></div>
    </div>`;
  }

  function requestDetail(item) {
    if (typeof modal !== 'function') return;
    modal(`<div class="modal-header"><div><h3>模型请求详情</h3><p class="dim-note">${esc(item.label || '模型请求')}</p></div><button class="close-x" onclick="closeModal()">×</button></div>
      <div class="card"><div class="kv"><span>状态</span><b>正在等待服务器返回持久任务</b></div><p class="dim-note mt8">这个请求尚未获得可控制的 Task ID。返回后会自动接入暂停、停止和任务详情操作。</p></div>
      <div class="row mt16"><button class="btn btn-ghost" onclick="closeModal()">关闭</button><button class="btn btn-secondary" onclick="go('tasks');closeModal()">打开任务管理</button></div>`, true);
  }

  async function controlTask(taskId, action) {
    if (!taskId || String(taskId).startsWith('model-request-')) return;
    const item = items.get(taskId);
    try {
      await api('POST', `/tasks/${encodeURIComponent(taskId)}/${action}`);
      const latest = await api('GET', `/tasks/${encodeURIComponent(taskId)}`);
      if (item) item.task = latest;
      render();
      if (activeStatuses.has(latest.status)) attachTask(taskId, item?.label || '', latest);
    } catch (error) {
      if (typeof toast === 'function') toast(error.message, 'error');
    }
  }

  function taskControls(item) {
    const task = item.task;
    const detail = item.request
      ? `<button type="button" class="btn btn-sm btn-ghost" onclick="modelWork.requestDetail('${escAttr(item.id)}')">详情</button>`
      : `<button type="button" class="btn btn-sm btn-ghost" onclick="showTaskDetail('${escAttr(item.id)}')">详情</button>`;
    if (!task || item.request) return detail;
    if (task.status === 'running') return `<button type="button" class="btn btn-sm btn-secondary" onclick="modelWork.controlTask('${escAttr(item.id)}','pause')">暂停</button><button type="button" class="btn btn-sm btn-danger" onclick="modelWork.controlTask('${escAttr(item.id)}','cancel')">停止</button>${detail}`;
    if (task.status === 'paused') return `<button type="button" class="btn btn-sm btn-primary" onclick="modelWork.controlTask('${escAttr(item.id)}','resume')">继续</button><button type="button" class="btn btn-sm btn-danger" onclick="modelWork.controlTask('${escAttr(item.id)}','cancel')">停止</button>${detail}`;
    if (task.status === 'queued' || task.status === 'pending') return `<button type="button" class="btn btn-sm btn-primary" onclick="modelWork.controlTask('${escAttr(item.id)}','start')">开始</button><button type="button" class="btn btn-sm btn-danger" onclick="modelWork.controlTask('${escAttr(item.id)}','cancel')">停止</button>${detail}`;
    return detail;
  }

  function render() {
    const root = document.getElementById('model-work-indicator');
    if (!root) return;
    // Tasks is the authoritative full-screen control surface.  Hiding the
    // duplicate floating card there prevents it from intercepting clicks on
    // the table's pause/cancel/retry actions; leaving the page restores the
    // compact global progress surface without losing the durable task row.
    if (S.page === 'tasks') {
      root.setAttribute('aria-hidden', 'true');
      root.innerHTML = '';
      return;
    }
    const visible = [...items.values()].filter((item) => !item.finished);
    if (!visible.length) {
      root.setAttribute('aria-hidden', 'true');
      root.innerHTML = '';
      return;
    }
    root.setAttribute('aria-hidden', 'false');
    root.innerHTML = `<section class="model-work-panel${collapsed ? ' is-collapsed' : ''}" aria-label="大模型工作进度">
      <div class="model-work-header"><span class="model-work-pulse" aria-hidden="true"></span><div><b>AI 正在工作</b><span>${collapsed ? '已折叠，任务仍在后台运行' : '页面不会卡住，完成后会自动更新'}</span></div><span class="model-work-count">${visible.length} 项</span><button type="button" class="btn btn-sm btn-ghost model-work-collapse" aria-expanded="${collapsed ? 'false' : 'true'}" aria-label="${collapsed ? '展开工作卡片' : '折叠工作卡片'}" onclick="modelWork.toggleCollapsed()">${collapsed ? '展开' : '折叠'}</button></div>
      <div class="model-work-list">${visible.slice(0, 5).map((item) => {
        const task = item.task;
        const progress = taskProgress(task);
        const isDeterminate = determinate(task, progress);
        const width = progress === null ? 0 : progress;
        const stage = taskStage(task);
        const status = taskStatus(task);
        return `<div class="model-work-item"><div class="model-work-item-head"><b>${esc(taskLabel(task, item.label))}</b><span>${esc(status)}</span></div>
          <div class="model-work-track" role="progressbar" aria-label="${esc(taskLabel(task, item.label))}" aria-valuemin="0" aria-valuemax="100"${isDeterminate ? ` aria-valuenow="${width}"` : ' aria-valuetext="模型正在处理"'}><div class="model-work-fill${isDeterminate ? '' : ' is-indeterminate'}" style="width:${isDeterminate ? width : 36}%"></div></div>
          <div class="model-work-item-foot"><span>${esc(item.error || stage)}</span><span>${isDeterminate ? `${width}%` : '处理中'}</span></div>${item.error ? `<div class="dim-note" style="color:var(--error)">状态读取失败，正在重试：${esc(item.error)}</div>` : ''}<div class="model-work-actions">${taskControls(item)}</div></div>`;
      }).join('')}</div>

    }

// ===== Legacy page async lifecycle =====
// Durable tasks intentionally outlive a page, but the legacy page watcher,
// request and timer must not.  StudioShell aborts this signal on navigation;
// these helpers make that boundary explicit for code that predates the shell.
function pageSignal(signal) {
  return signal || window.__studioWorkspaceSignal || null;
}
function pageAbortError() {
  const error = new Error('页面请求已取消');
  error.name = 'AbortError';
  return error;
}
function pageTimeout(callback, delay, signal) {
  const scopedSignal = pageSignal(signal);
  if(scopedSignal?.aborted)return null;
  let timer=0;
  const onAbort=()=>{if(timer)window.clearTimeout(timer);};
  timer=window.setTimeout(()=>{
    scopedSignal?.removeEventListener('abort',onAbort);
    if(!scopedSignal?.aborted)callback();
  },delay);
  scopedSignal?.addEventListener('abort',onAbort,{once:true});
  return timer;
}
function pageSleep(delay, signal) {
  const scopedSignal=pageSignal(signal);
  if(scopedSignal?.aborted)return Promise.reject(pageAbortError());
  return new Promise((resolve,reject)=>{
    let timer=0;
    const onAbort=()=>{
      if(timer)window.clearTimeout(timer);
      scopedSignal?.removeEventListener('abort',onAbort);
      reject(pageAbortError());
    };
    timer=window.setTimeout(()=>{
      scopedSignal?.removeEventListener('abort',onAbort);
      resolve();
    },delay);
    scopedSignal?.addEventListener('abort',onAbort,{once:true});
  });
}

// ===== API =====
async function api(method, path, body, isForm, requestOptions){
  const modelLabel = modelWork.labelForRequest(method, path, body);
  const requestId = modelLabel ? modelWork.beginRequest(modelLabel) : null;
  try {
    const opts={method,headers:{}};
    // Workspace renders own a short-lived request scope.  Interactive actions
    // and durable task polling intentionally stay outside it so navigation
    // cancels only stale page assembly, not background work tracking.
    const requestSignal = requestOptions?.signal || (
      requestOptions?.background
        ? null
        : (window.__studioRenderingPage ? window.__studioRenderSignal : window.__studioWorkspaceSignal)
    );
    if(requestSignal && !requestSignal.aborted) opts.signal=requestSignal;
    if(body && !isForm){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
    if(isForm){opts.body=body;}
    const res=await fetch('/api/v1'+path,opts);
    if(!res.ok){
      const e=await res.json().catch(()=>({detail:res.statusText}));
      const detail=e.detail||e.message||'请求失败';
      const error=new Error(typeof detail==='string'?detail:(detail.message||detail.code||'请求失败'));
      error.status=res.status;
      error.code=typeof detail==='object'?(detail.code||''):e.code||'';
      error.detail=detail;
      error.payload=e;
      throw error;
    }
    const ct=res.headers.get('content-type')||'';
    const data=ct.includes('json')?await res.json():await res.text();
    if(requestId){modelWork.attachTaskIds(data, modelLabel);modelWork.endRequest(requestId);}
    return data;
  } catch (error) {
    if(requestId) modelWork.endRequest(requestId);
    throw error;
  }
}

    const system=typeof reference.system_prompt==='string'?reference.system_prompt:'';
    const messages=Array.isArray(reference.messages)?reference.messages:[];
    if(system||messages.length)return [system?`[system]\n${system}`:'',...messages.map(message=>`[${message?.role||'message'}]\n${message?.content||''}`)].filter(Boolean).join('\n\n');
  }
  if(kind==='output'&&typeof reference.content==='string')return reference.content;
  return '';
}
function renderGenerationRun(run,index){
  const input=run.input_reference||run.inputReference||{};
  const output=run.output_reference||run.outputReference||{};
  const prompt=generationReferenceText(input,'input');
  const content=generationReferenceText(output,'output');
  const fallbackPrompt=prompt||'历史任务未保存完整输入提示词。';
  const fallbackOutput=content||'历史任务未保存模型输出正文。';
  return `<article class="task-run"><div class="task-run-header"><b>模型调用 ${index+1}</b><span class="badge badge-muted">${esc(run.model_id||'未记录模型')}</span><span class="text-sm text-muted">输入 ${run.prompt_tokens||run.tokens_in||0} · 输出 ${run.completion_tokens||run.tokens_out||0} · 耗时 ${run.latency_ms||0} 毫秒</span>${run.error_code?`<span class="badge badge-error">${esc(run.error_code)}</span>`:''}</div><div class="task-run-section"><div class="task-run-label">输入提示词</div><pre class="task-prompt">${esc(fallbackPrompt)}</pre></div><div class="task-run-section"><div class="task-run-label">模型输出（Markdown 渲染）</div><div class="task-output markdown-body">${content?markdownToHtml(content):`<p class="dim-note">${esc(fallbackOutput)}</p>`}</div></div></article>`;
}

const BOOK_PRIMARY_NAV_IDS=new Set(['book','wizard','chapters']);

function persistNavState(){
  try{localStorage.setItem(NAV_STATE_KEY,JSON.stringify({expandedBooks:S.expandedBooks,expandedExtensions:S.expandedExtensions}));}catch(_){}
}

function navIcon(path){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path.split(' M').map((d,i)=>`<path d="${i===0?d:'M'+d}"/>`).join('')}</svg>`;
}

function navPageAvailable(item){return Boolean(item?.id&&typeof PAGES[item.id]==='function');}

function notifyNavUnavailable(label){toast(`${label} 当前未接入 Studio，请刷新后重试。`,'warning');}

function renderNavItem(item,bookId,kind){
  if(!navPageAvailable(item)) return '';
  const available=navPageAvailable(item);
  const active=S.page===item.id&&(!bookId||S.book===bookId);
  const action=available
    ? (bookId?`goForBook('${escAttr(item.id)}','${escAttr(bookId)}')`:`go('${escAttr(item.id)}')`)
    : `notifyNavUnavailable('${escAttr(item.label||item.id)}')`;
  return `<button type="button" class="nav-item ${kind||''} ${active?'active':''} ${available?'':'nav-item-disabled'}" onclick="${action}" ${available?'':'aria-disabled="true" title="功能尚未接入"'}>
    ${navIcon(item.icon)}<span class="nav-item-label">${esc(item.label)}</span>${available?'':'<span class="nav-unavailable">暂不可用</span>'}
  </button>`;
}

function renderBookBranch(book){
  const availableBookItems=NAV.filter(item=>item.id&&item.bookOnly&&navPageAvailable(item));
  const primaryItems=availableBookItems.filter(item=>BOOK_PRIMARY_NAV_IDS.has(item.id));
  const extensionItems=availableBookItems.filter(item=>!BOOK_PRIMARY_NAV_IDS.has(item.id));
  const groupedItems={};
  extensionItems.forEach(item=>{const group=item.navGroup||'更多功能';(groupedItems[group]||(groupedItems[group]=[])).push(item);});
  const bookIsActive=S.book===book.id;
  const bookIsOpen=Boolean(S.expandedBooks[book.id]||bookIsActive);
  const extensionsAreOpen=Boolean(S.expandedExtensions[book.id]||bookIsActive&&extensionItems.some(item=>item.id===S.page));
  const bookLetter=String(book.title||'作品').trim().slice(0,1)||'作';
  const groupHtml=Object.keys(groupedItems).map(group=>'<div class="nav-extension-group"><div class="nav-extension-group-label">'+esc(group)+'</div>'+groupedItems[group].map(item=>renderNavItem(item,book.id,'nav-child nav-extension-child')).join('')+'</div>').join('');
  return '<div class="nav-book-branch '+(bookIsActive?'is-active':'')+'">'+
    '<div class="nav-book-row"><button type="button" class="nav-book-toggle" onclick="toggleBookBranch(\''+escAttr(book.id)+'\')" aria-expanded="'+(bookIsOpen?'true':'false')+'" title="'+escAttr(book.title||'作品')+'">'+
    '<span class="nav-book-mark">'+esc(bookLetter)+'</span><span class="nav-book-name">'+esc(book.title||'未命名作品')+'</span><span class="nav-chevron '+(bookIsOpen?'is-open':'')+'" aria-hidden="true">›</span></button></div>'+
    (bookIsOpen?'<div class="nav-book-children">'+primaryItems.map(item=>renderNavItem(item,book.id,'nav-child')).join('')+
      '<button type="button" class="nav-extension-toggle '+(extensionsAreOpen?'is-open':'')+'" onclick="toggleBookExtensions(\''+escAttr(book.id)+'\')" aria-expanded="'+(extensionsAreOpen?'true':'false')+'"><span class="nav-extension-glyph" aria-hidden="true">+</span><span>规划与结构 / 创作与审查</span><span class="nav-extension-count">'+extensionItems.length+'</span><span class="nav-chevron '+(extensionsAreOpen?'is-open':'')+'" aria-hidden="true">›</span></button>'+
      (extensionsAreOpen?'<div class="nav-extension-list">'+groupHtml+'</div>':'')+'</div>':'')+
    '</div>';
}

function renderNav(){
  const nav=document.getElementById('nav');
  let html='';
  NAV.forEach(item=>{
    if(item.bookOnly)return;
    if(item.sec!==undefined){html+=`<div class="nav-section">${esc(item.sec)}</div>`;return;}
    html+=renderNavItem(item,'','nav-top-level');
    if(item.id==='dashboard'){
      if(S.books.length){html+='<div class="nav-worktree-label">作品</div>'+S.books.map(renderBookBranch).join('');}
      else if(S.page==='dashboard'){html+='<div class="nav-worktree-empty">还没有作品</div>';}
    }
  });
  nav.innerHTML=html;
}

// ===== Router =====
function setActiveBook(bookId){
  S.book=bookId||null;
  if(S.book){
    localStorage.setItem(ACTIVE_BOOK_KEY,S.book);
    S.expandedBooks[S.book]=true;
  }else{
    localStorage.removeItem(ACTIVE_BOOK_KEY);
  }
  persistNavState();
  if(window.modelWork) window.modelWork.restoreActiveTasks();
}
function toggleBookBranch(bookId){S.expandedBooks[bookId]=!S.expandedBooks[bookId];persistNavState();renderNav();}
function toggleBookExtensions(bookId){S.expandedBooks[bookId]=true;S.expandedExtensions[bookId]=!S.expandedExtensions[bookId];persistNavState();renderNav();}
function loadBooksForNav(){
  if(S.books.length||window._bookNavLoading||IS_FILE_PREVIEW)return;
  window._bookNavLoading=true;
  api('GET','/books',undefined,undefined,{background:true}).then(data=>{S.books=data.books||[];renderNav();}).catch(()=>{}).finally(()=>{window._bookNavLoading=false;});
}
function goForBook(page,bookId){
  setActiveBook(bookId);
  if(routeStoryFlowCompatibility(page)) return;
  if(!BOOK_PRIMARY_NAV_IDS.has(page))S.expandedExtensions[bookId]=true;
  S.page=page;
  localStorage.setItem(ACTIVE_PAGE_KEY,page);
  persistNavState();
  renderNav();
  render();
}
function go(page){
  const bookOnly=NAV.some(item=>item.id===page&&item.bookOnly);
  if(bookOnly&&!S.book){toast('请先在「我的创作」中打开一本作品。','warning');return;}
  if(routeStoryFlowCompatibility(page)) return;
  if(S.book)loadBooksForNav();
  S.page=page;localStorage.setItem(ACTIVE_PAGE_KEY,page);renderNav();render();
}

function renderFilePreview(p){
  p.innerHTML=`<div class="header"><div><h2>本地预览模式</h2><p class="subtitle">视觉优化已加载，数据功能需要 HTTP 服务</p></div></div>
    <div class="content"><div class="card file-preview-card"><div class="file-preview-kicker">VISUAL PREVIEW</div><h3>请通过 NovelForge Studio 服务访问</h3><p class="dim-note">直接打开 index.html 只能预览界面，不能访问后端 API。</p><pre class="mono">python run.py serve
http://127.0.0.1:8000/</pre></div></div>`;
}

async function render(){
  const p=document.getElementById('page');
  if(IS_FILE_PREVIEW){renderFilePreview(p);return;}
  const renderToken=window.__studioRenderToken;
  if(renderToken!==undefined && renderToken!==window.__studioRenderToken)return;
  const fn=PAGES[S.page];
  if(!fn){p.innerHTML='<div class="content"><div class="empty-state"><h2>页面开发中</h2></div></div>';return;}
  p.innerHTML='<div class="loading"><div class="spinner"></div>加载中...</div>';
  try{
    await fn(p);
    if(renderToken!==undefined && renderToken!==window.__studioRenderToken)return;
  }
  catch(e){
    if(e&&e.name==='AbortError') return;
    if(renderToken!==undefined && renderToken!==window.__studioRenderToken)return;
    p.innerHTML=`<div class="header"><h2>出错了</h2></div><div class="content"><div class="card"><p style="color:var(--error)">${esc(e.message)}</p></div></div>`;
  }
}

function initSSE(){
  if(IS_FILE_PREVIEW){setConn(false);return;}
  try{
    const es=new EventSource('/api/v1/events');
    S.sse=es;
    es.addEventListener('task_progress',ev=>{
      try{const t=JSON.parse(ev.data);S.activeTasks[t.id]=t;window.dispatchEvent(new CustomEvent('task-update',{detail:t}));}catch(_){}
    });
    es.onopen=()=>setConn(true);
    es.onerror=()=>setConn(false);
  }catch(_){ setConn(false); }
}
function setConn(on){
  document.getElementById('conn-dot').className='dot'+(on?'':' off');
  document.getElementById('conn-text').textContent=on?'实时同步中':'实时连接断开';
}

let _contTask=null;
async function startContinuous(){

  try{ await api('PUT','/project',{passScore:score,jointReviewInterval:interval}); }catch(e){}

function onContUpdate(ev){ const t=ev.detail; if(_contTask && t.id===_contTask) renderTaskProgress(t); }
function logLine(t){

  d.textContent='· '+t; box.appendChild(d); box.scrollTop=box.scrollHeight;

function stopContinuous(){

async function continuousTaskAction(action){
  if(!_contTask)return;
  try{await api('POST','/tasks/'+_contTask+'/'+action);toast('任务状态已更新','success');pollTask(_contTask);}
  catch(e){toast(e.message,'error');}
}
function renderTaskActions(t){
  const el=document.getElementById('c-task-actions'); if(!el)return;
  const actions=[];
  if(t.status==='running') actions.push(`<button class="btn btn-sm btn-secondary" onclick="continuousTaskAction('pause')">暂停</button>`,`<button class="btn btn-sm btn-danger" onclick="continuousTaskAction('cancel')">取消</button>`);
  if(t.status==='waiting_on_child') actions.push(`<button class="btn btn-sm btn-danger" onclick="continuousTaskAction('cancel')">取消</button>`);
  if(t.status==='paused') actions.push(`<button class="btn btn-sm btn-primary" onclick="continuousTaskAction('resume')">恢复</button>`,`<button class="btn btn-sm btn-danger" onclick="continuousTaskAction('cancel')">取消</button>`);
  if(t.status==='failed') actions.push(`<button class="btn btn-sm btn-secondary" onclick="continuousTaskAction('retry')">重试</button>`);
  el.innerHTML=`${statusBadge(t.status)}<span class="dim-note">阶段：${esc(t.stage||'queued')}</span>${actions.join('')}`;
}
async function pollTask(id, signal=window.__studioWorkspaceSignal){
  // Continuous writing is durable server work, but this page watcher is not.
  // Navigation or an explicit "stop listening" must prevent stale timers and
  // detached DOM nodes from receiving later task snapshots.
  if(!id || _contTask!==id || signal?.aborted) return;
  try{
    const t = await api('GET','/tasks/'+id,undefined,undefined,{signal});
    if(_contTask!==id || signal?.aborted) return;
    if(window.modelWork) window.modelWork.attachTask(id,t.displayName||t.operationLabel||'连续创作',t);
    renderTaskProgress(t);
    renderTaskActions(t);
    if(['queued','pending','running','waiting_on_child','cancelling'].includes(t.status)){ window._continuousPollTimer=pageTimeout(()=>pollTask(id,signal),2000,signal); }
    else if(t.status==='completed'){ logLine('✔ 全部完成'); renderTaskResults(t); }
    else if(t.status==='failed'){ logLine('✘ 失败: '+(t.error||'')); }
  }catch(e){
    if(signal?.aborted || _contTask!==id || e?.name==='AbortError') return;
    window._continuousPollTimer=pageTimeout(()=>pollTask(id,signal),3000,signal);
  }
}
let _lastProg='';
function renderTaskProgress(t){
  const total=t.data?.count||1, checkpoint=t.checkpoint?.state||{};
  const done=(checkpoint.completed||t.result?.completed||[]).length;
  const bar=document.getElementById('c-bar'); if(bar) bar.style.width=Math.round(done/total*100)+'%';
  const stat=document.getElementById('c-stat'); if(stat) stat.textContent=`已完成 ${done}/${total} 章 · ${t.status} · 阶段：${t.stage||'queued'}${checkpoint.message?(' · '+checkpoint.message):''}`;
  const p=checkpoint.message||checkpoint.chapter_number?`检查点：${checkpoint.message||('第 '+checkpoint.chapter_number+' 章')}`:'';
  if(p && p!==_lastProg){ _lastProg=p; logLine(p); }
  const tb=document.querySelector('#c-table tbody');
  const rows=t.result?.results||[];
  if(tb && rows.length){ tb.innerHTML=rows.filter(c=>c.chapter||c.joint_review).map(c=>c.joint_review?`<tr><td colspan="2">第 ${c.joint_review.start_chapter||''}-${c.joint_review.end_chapter||''} 章联合审查</td><td>${c.joint_review.overall_score??'—'}</td><td>—</td><td>${statusBadge(c.joint_review.verdict==='pass'?'approved':'reviewing')}</td></tr>`:`<tr><td>${c.chapter}</td><td>${esc(c.title||'')}</td><td>${c.word_count??'-'}</td><td>—</td><td>${c.completed?'<span class="badge badge-success">已完成</span>':'<span class="badge badge-warning">待处理</span>'}</td></tr>`).join(''); }
}
function renderTaskResults(t){
  const r=t.result; if(!r) return;
  const tb=document.querySelector('#c-table tbody');

    <div class="info-banner"><b>怎么使用：</b><span>每一步先回答一个小问题，保存后可以让 AI 给建议；你确认后才会进入下一步。你不需要一次想完整本书，先写你确定的部分即可。</span><span class="badge badge-info">${confirmed}/25 已确认</span></div>
    ${planningManaged&&readiness&&!readiness.ready?planningGateMarkup(readiness,workflow.mode):`<div class="info-banner"><b>创作前规划检查：</b><span>${esc(planningReadinessSummary(readiness)||'已完成规划检查')}</span><span class="badge badge-success">可开始正文创作</span></div>`}

    <div class="wizard-layout">
      <div class="card wizard-step-list"><h3>25 步清单</h3>${steps.map(s=>`<button class="wizard-step ${s.number===currentNumber?'active':''}" onclick="wizardOpenStep(${s.number})"><span class="wizard-step-number ${s.status==='confirmed'?'done':''}">${s.number}</span><span>${esc(s.label||s.key)}</span><span class="wizard-step-status">${s.status==='confirmed'?'✓':s.status==='draft'?'草稿':'待填写'}</span></button>`).join('')}</div>

           <div class="field mt16"><label for="wizard-draft">你的答案</label><textarea class="input textarea" id="wizard-draft" style="min-height:220px" placeholder="用自己的话写，几句话也可以。">${esc(draftText)}</textarea></div>

      </div>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="btn btn-primary" onclick="wizardPublish()" ${confirmed<25?'disabled':''}>发布 Story Bible</button></div>
  </div>`;
};
function wizardDraftText(value){
  if(value===null||value===undefined)return '';
  if(typeof value==='string')return value;
  if(Array.isArray(value))return value.map(item=>wizardDraftText(item)).filter(Boolean).join('\n');
  // Imported steps are stored as {content, sections, sourceDocuments, ...}.
  // Show the readable source content, never the storage envelope.
  if(typeof value==='object' && typeof value.content==='string')return value.content;
  if(typeof value==='object')return Object.entries(value).filter(([key])=>!['sourceDocuments','sections','imported','needsReview','stepKey'].includes(key)).map(([key,item])=>{
    const text=wizardDraftText(item); return text?`${key}：${text}`:'';
  }).filter(Boolean).join('\n');
  return String(value);
}
function wizardOpenStep(number){S._wizardStepNumber=number;render();}
async function wizardSave(stepKey){
  const draft=val('wizard-draft').trim(); if(!draft)return toast('请先写下你的答案','warning');
  try{await api('POST','/books/'+S.book+'/wizard/steps/'+stepKey,{draft,source:'author'});toast('草稿已保存','success');render();}
  catch(e){toast(e.message,'error');}
}
async function wizardConfirm(stepKey){
  const draft=val('wizard-draft').trim(); if(!draft)return toast('请先写下你的答案','warning');
  const flightKey=`${S.book||''}:${stepKey}`;
  if(S._wizardConfirmInFlight)return;
  S._wizardConfirmInFlight=flightKey;
  try{
    await api('POST','/books/'+S.book+'/wizard/steps/'+stepKey,{draft,source:'author'});
    await api('POST','/books/'+S.book+'/wizard/steps/'+stepKey+'/confirm');
    S._wizardStepNumber=Math.min((S._wizardStepNumber||1)+1,25);toast('已确认，进入下一步','success');render();
  }catch(e){toast(e.message,'error');}
  finally{if(S._wizardConfirmInFlight===flightKey)S._wizardConfirmInFlight='';}
}
async function wizardGenerate(stepKey){
  try{toast('AI 建议任务已提交','info');const r=await api('POST','/books/'+S.book+'/wizard/steps/'+stepKey+'/generate',{brief:val('wizard-draft')});if(r.suggestion){window._wizardSuggestion=r.suggestion;}render();}
  catch(e){toast(e.message,'error');}
}
function wizardUseSuggestion(stepKey){
  const step=(window._wizardState||{}).steps?.find(item=>item.key===stepKey);
  if(step?.suggestion)document.getElementById('wizard-draft').value=wizardDraftText(step.suggestion);
}
async function wizardPublish(){
  try{await api('POST','/books/'+S.book+'/wizard/publish');toast('Story Bible 已发布，正在生成作品结构','success');go('book');}
  catch(e){toast(e.message,'error');}
}

  `<div class="content">

        <table class="table"><thead><tr><th>章</th><th>标题</th><th>字数</th><th>最近评分</th><th>状态</th><th></th></tr></thead>

        <div class="row row-wrap">
          <button class="btn btn-sm btn-secondary" onclick="opAudit()">审查打分</button>
          <button class="btn btn-sm btn-secondary" onclick="opRevise()">修订一轮</button>

async function loadChapterRows(numbers){

async function monitorWriteTask(tid, signal=pageSignal()){
  const s=document.getElementById('wn-status'); if(!s||signal?.aborted)return;
  try{
    const t=await api('GET','/tasks/'+tid,undefined,undefined,{signal});
    if(signal?.aborted)return;
    S.activeTasks[tid]=t;
    if(window.modelWork) window.modelWork.attachTask(tid,'章节写作',t);
    const detail=t.error||t.error_code||(typeof t.progress==='string'&&t.progress)||t.status||'处理中';
    const failed=t.status==='failed'||t.status==='needs_author_decision';
    s.innerHTML=`<div class="warn-banner"${failed?' style="border-color:var(--error);color:var(--error)"':''}>✍ 任务 ${esc(t.id)}：${esc(detail)}</div>`;
    if(['queued','pending','running','paused','cancelling'].includes(t.status)) pageTimeout(()=>monitorWriteTask(tid,signal),2000,signal);
    else if(t.status==='completed'){localStorage.removeItem(WRITE_TASK_KEY+S.book);toast('新章节完成','success');go('chapters');}
  }catch(e){
    if(e?.name==='AbortError'||signal?.aborted)return;
    s.innerHTML=`<div class="warn-banner" style="border-color:var(--error);color:var(--error)">✘ 无法读取任务 ${esc(tid)}：${esc(e.message)}</div>`;
  }
}

async function waitForTask(taskId, renderStatus, maxPolls=300, signal=pageSignal()){
  let polls=0; let lastTask=null;
  while(polls<maxPolls){
    if(signal?.aborted)throw pageAbortError();
    const task=await api('GET','/tasks/'+taskId,undefined,undefined,{signal});
    if(signal?.aborted)throw pageAbortError();
    lastTask=task; S.activeTasks[taskId]=task;
    if(window.modelWork) window.modelWork.attachTask(taskId,task.displayName||task.operationLabel||task.type,task);
    if(renderStatus)renderStatus(task);
    if(task.status==='completed'){if(window.modelWork)window.modelWork.finishTask(taskId);return task;}
    if(['failed','cancelled','needs_author_decision'].includes(task.status)){
      if(window.modelWork)window.modelWork.finishTask(taskId);
      throw new Error(task.error || task.error_code || `任务${task.status}`);
    }
    polls+=1;
    // A queued task is not progress. Surface a stopped/disabled Studio worker
    // instead of leaving the author on an endless spinner.
    if(polls===3){
      try{
        const daemon=await api('GET','/daemon');
        if(daemon.disabledByEnvironment)throw new Error('当前 Studio Worker 被环境变量禁用，请重启服务或取消 NOVELFORGE_DISABLE_STUDIO_WORKER。');
        if(!daemon.running)throw new Error('当前没有运行中的 Studio Worker，请到任务管理启动 Worker 后再重试。');
      }catch(error){
        if(error?.message&&/Worker/.test(error.message))throw error;
      }
    }
    await pageSleep(1000,signal);
  }
  const timeout=new Error(`任务 ${taskId} 轮询超时（${maxPolls} 次）`);
  timeout.code='TASK_POLL_TIMEOUT'; timeout.taskId=taskId; timeout.lastTask=lastTask;
  throw timeout;
}

function openChapterEditor(num,chapter,isNew){
  const title=chapter.title||'', content=chapter.content||'';
  const AUTOSAVE_KEY=`novelforge-autosave-${S.book}-${num}`;
  // Restore from autosave if available
  let restoredContent=content;

  try{
    const saved=JSON.parse(localStorage.getItem(AUTOSAVE_KEY)||'null');

    <div class="field"><label>正文</label><textarea class="input textarea" id="chapter-editor-content" style="min-height:42vh" placeholder="在此直接写作…">${esc(restoredContent)}</textarea></div>
    <div class="row row-wrap"><button class="btn btn-primary" id="chapter-editor-save" data-base-version="${Number(chapter.version||0)}" onclick="saveChapterEditor()">保存新版本</button>
    ${isNew?'':`<button class="btn btn-secondary" onclick="showChapterVersions(${num})">版本历史</button>`}
    ${isNew?'':`<button class="btn btn-danger" onclick="deleteChapterFromEditor(${num})">删除章节</button>`}</div>`,true);
  // Auto-save state
  let _isDirty=false, _debounceTimer=null, _saveCount=0, _lastSaveTime=null;
  const contentEl=document.getElementById('chapter-editor-content');
  const titleEl=document.getElementById('chapter-editor-title');
  const dotEl=document.getElementById('autosave-dot');
  const textEl=document.getElementById('autosave-text');
  function markDirty(){_isDirty=true;if(dotEl)dotEl.style.background='var(--warning)';if(textEl)textEl.textContent='未保存';}
  function markClean(){_isDirty=false;if(dotEl)dotEl.style.background='var(--success)';if(textEl)textEl.textContent='已保存';_lastSaveTime=new Date();_saveCount++;}
  function doAutoSave(){
    try{
      const data=JSON.stringify({title:titleEl?.value||'',content:contentEl?.value||'',timestamp:Date.now(),saveCount:_saveCount});
      localStorage.setItem(AUTOSAVE_KEY,data);
      markClean();
    }catch(e){if(dotEl)dotEl.style.background='var(--error)';if(textEl)textEl.textContent='保存失败';}
  }
  function scheduleSave(){clearTimeout(_debounceTimer);markDirty();_debounceTimer=setTimeout(doAutoSave,2000);}
  if(contentEl)contentEl.addEventListener('input',scheduleSave);
  if(titleEl)titleEl.addEventListener('input',scheduleSave);
  // beforeunload handler
  const unloadHandler=function(e){if(_isDirty){e.preventDefault();e.returnValue='';}};
  window.addEventListener('beforeunload',unloadHandler);
  // Store cleanup function
  window._chapterEditorCleanup=function(){
    window.removeEventListener('beforeunload',unloadHandler);
    clearTimeout(_debounceTimer);
    window._chapterEditorCleanup=null;
  };
  // Auto-save every 30s even if not dirty
  const autoInterval=setInterval(()=>{if(contentEl?.value)doAutoSave();},30000);
  window._chapterEditorAutoInterval=autoInterval;
}

function drawMindmapLinks(){
  const shell=document.querySelector('.mindmap-shell');const svg=shell?.querySelector('.mindmap-link-layer');
  if(!shell||!svg)return;
  const bounds=shell.getBoundingClientRect();const width=Math.max(shell.clientWidth,1);const height=Math.max(shell.scrollHeight,shell.clientHeight,1);
  const point=(element,side)=>{const rect=element.getBoundingClientRect();return {x:rect.left-bounds.left+rect.width/2,y:(side==='top'?rect.top:rect.bottom)-bounds.top};};
  const curve=(from,to)=>{const distance=Math.max(28,Math.abs(to.y-from.y)*.42);return `M ${from.x.toFixed(1)} ${from.y.toFixed(1)} C ${from.x.toFixed(1)} ${(from.y+distance).toFixed(1)}, ${to.x.toFixed(1)} ${(to.y-distance).toFixed(1)}, ${to.x.toFixed(1)} ${to.y.toFixed(1)}`;};
  const root=shell.querySelector('[data-mindmap-root]');const paths=[];
  shell.querySelectorAll('[data-mindmap-group]').forEach(group=>{
    const title=group.querySelector('[data-mindmap-group-title]');if(!title)return;
    if(root)paths.push(`<path class="mindmap-link" d="${curve(point(root,'bottom'),point(title,'top'))}"></path>`);
    group.querySelectorAll('[data-mindmap-node]').forEach(node=>paths.push(`<path class="mindmap-link" d="${curve(point(title,'bottom'),point(node,'top'))}"></path>`));

function drawScoreChart(scores){
  const el=document.getElementById('score-chart'); if(!el)return;
  if(!scores.length){el.innerHTML='<div class="empty-state" style="padding:32px">完成至少一章审查后，这里会显示评分趋势。</div>';return;}
  el.innerHTML=scores.map(item=>{
    const score=item.score===null||item.score===undefined?null:Number(item.score);
    const width=score===null?0:Math.max(3,Math.min(100,score));
    const color=score===null?'var(--secondary)':score>=93?'var(--success)':score>=80?'var(--warning)':'var(--error)';
    return `<div class="score-row"><span class="score-chapter">第${item.chapter}章</span><span class="score-track"><span class="score-fill" style="width:${width}%;background:${color}"></span></span><b style="color:${score===null?'var(--text-muted)':color}">${score===null?'未审查':score.toFixed(1)}</b><span class="score-words">${(item.wordCount||0).toLocaleString()} 字</span></div>`;
  }).join('');
}

function renderNativeReviewChapter(chapter){
  if(!chapter)return '<div class="card"><p class="muted">该章节还没有可供审查的已保存版本。</p></div>';
  const review=chapter.latestReview;
  const reviewPassed=Boolean(review?.passed)&&review?.verdict==='pass';
  const issues=Array.isArray(review?.issues)?review.issues:[];
  const commits=Array.isArray(chapter.pendingCommits)?chapter.pendingCommits:[];
  const acceptable=new Set(chapter.acceptableCommitIds||[]);
  const reviewSummary=review
    ? `<div class="gate-box"><div class="gate ${reviewPassed?'pass':'fail'}"><div class="g-label">最新 Review</div><div class="g-val">${review.overall_score??'—'} 分</div></div><div class="gate ${reviewPassed?'pass':'fail'}"><div class="g-label">结论</div><div class="g-val">${esc(review.verdict||'待处理')}</div></div><div class="gate ${chapter.blockingIssueCount?'fail':'pass'}"><div class="g-label">阻断问题</div><div class="g-val">${chapter.blockingIssueCount||0}</div></div></div>`
    : '<div class="warn-banner">本章还没有原生 Review。请先运行章节审查，Review 必须针对当前 ChapterVersion。</div>';
  const issueMarkup=issues.length
    ? `<div class="workspace-section"><b>Review 问题</b><ul>${issues.slice(0,8).map(issue=>`<li>${esc(issue.description||'未提供问题描述')} · ${esc(issue.severity||'medium')} · ${esc(issue.status||'open')}</li>`).join('')}</ul></div>`
    : '';
  const commitMarkup=commits.length
    ? commits.map(commit=>{
        const canAccept=acceptable.has(commit.id);
        const action=canAccept&&review
          ? `<button class="btn btn-sm btn-primary" onclick="acceptReviewedCommit('${escAttr(commit.id)}','${escAttr(review.id)}',${chapter.number})">作者确认并接受</button>`
          : '<span class="dim-note">等待匹配的通过 Review</span>';
        return `<div class="list-row"><span><b class="mono">${esc(commit.id)}</b><br><span class="dim-note">ChapterVersion ${esc(commit.chapterVersionId||'—')} · ${esc(commit.status||'pending')}</span></span><span>${action}</span></div>`;
      }).join('')
    : '<p class="muted">当前没有待接受的 StoryCommit。写作或导入流程应先持久化 pending commit，再由本工作台完成作者确认。</p>';
  return `<div class="workspace-section"><div class="row row-wrap"><b>第 ${chapter.number} 章 · ${esc(chapter.title||'未命名')}</b><span class="dim-note">版本 ${esc(chapter.latestVersion?.version??'—')} · ${esc(chapter.latestVersion?.wordCount??0)} 字</span><span class="spacer"></span>${statusBadge(chapter.status||'draft')}</div>${reviewSummary}${issueMarkup}<div class="workspace-section"><b>待接受 StoryCommit</b>${commitMarkup}</div>${chapter.canAccept?'<div class="success-banner">Review 已通过且版本精确匹配；仍需作者明确确认后才会写入 Canon。</div>':'<div class="info-banner">Canon 接受条件：当前版本、通过 Review、无阻断问题，并由作者明确确认。</div>'}</div>`;
}
window.loadNativeReviewWorkspace=async function(){
  const chapterNumber=Number(val('rw-chapter')||1);
  const out=document.getElementById('native-review-out');
  if(!out||!Number.isInteger(chapterNumber)||chapterNumber<1)return toast('请填写有效的章节号','warning');
  out.innerHTML='<div class="loading"><div class="spinner"></div>正在读取本章 Review 与 Canon 接受状态…</div>';
  try{
    const workspace=await api('GET','/books/'+S.book+'/review-workspace?chapter='+chapterNumber,undefined,false,{background:true});
    out.innerHTML=renderNativeReviewChapter(workspace.chapters?.[0]||null);
  }catch(e){out.innerHTML=`<div class="warn-banner" style="border-color:var(--error);color:var(--error)">无法读取本章 Review 工作台：${esc(e.message)}</div>`;}
};
window.acceptReviewedCommit=async function(commitId,reviewId,chapterNumber){
  if(!confirm(`确认接受第 ${chapterNumber} 章的 Review 结果，并将 StoryCommit 写入 Canon？`))return;
  try{
    const result=await api('POST','/books/'+S.book+'/chapters/'+chapterNumber+'/accept-reviewed-commit',{commitId,reviewId,authorConfirmed:true},false,{background:true});
    toast(result.idempotent?'Canon 已确认（重复请求已幂等处理）':'Canon 已接受 StoryCommit','success');
    await window.loadNativeReviewWorkspace();
  }catch(e){toast(e.message,'error');}
};

PAGES.jointreview=async(p)=>{
  if(!S.book){go('dashboard');return;}
  const b=await api('GET','/books/'+S.book);

async function runJoint(){
  const start=+val('jr-start'), end=+val('jr-end');
  if(!Number.isInteger(start)||!Number.isInteger(end)||start<1||end<start)return toast('请填写有效的章节范围','warning');
  const btn=document.getElementById('jr-run'); btn.disabled=true;
  const out=document.getElementById('jr-out');
  out.innerHTML='<div class="loading"><div class="spinner"></div>联合审查中（跨章分析，耗时较久）…</div>';
  try{ const queued=await api('POST','/books/'+S.book+'/joint-review',{startChapter:start,endChapter:end});
    const r=(await waitForTask(queued.taskId,t=>{out.innerHTML=`<div class="warn-banner">联合审查任务 ${esc(t.status)}：${esc(taskDetail(t))}</div>`;})).result||{};
    out.innerHTML=`<div class="card"><div class="card-title-row"><h3>第 ${esc(r.chapterRange||`${start}-${end}`)} 章审查结果</h3><span class="badge ${r.verdict==='pass'?'badge-success':'badge-warning'}">${esc(r.verdict||'待处理')}</span></div><div class="review-score-large" style="color:${scoreColor(r.overallScore)}">${r.overallScore??'—'} <small>综合分</small></div><p class="text-sm text-muted mt8">${esc(r.summary||'暂无摘要')}</p></div>
      ${(r.issues||[]).length?`<div class="card"><h3>需要作者处理的问题（${r.issues.length}）</h3><table class="table"><thead><tr><th>章节</th><th>维度</th><th>严重程度</th><th>问题</th><th>建议</th></tr></thead><tbody>${r.issues.map(i=>`<tr><td>${esc((i.chapter_numbers||[]).join('、')||'跨章')}</td><td>${esc(i.dimension||'一致性')}</td><td>${esc(i.severity||'')}</td><td>${esc(i.description||workspaceText(i))}</td><td>${esc(i.suggestion||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card"><p class="muted">未发现需要记录的问题。</p></div>'}`;
  }catch(e){ out.innerHTML=`<div class="card"><p style="color:var(--error)">${esc(e.message)}</p></div>`; }

}

async function saveServices(){
  const cards=[...document.querySelectorAll('.provider-model-card')]; const providerMap=new Map(),models=[];
  for(const card of cards){const provider={id:card.dataset.providerId,name:card.querySelector('.pm-name').value.trim(),providerType:card.querySelector('.pm-type').value,baseUrl:card.querySelector('.pm-url').value.trim()};const key=card.querySelector('.pm-key').value,env=card.querySelector('.pm-env').value.trim();if(key)provider.apiKey=key;else if(env)provider.credentialEnv=env;providerMap.set(provider.id,{...(providerMap.get(provider.id)||{}),...provider});const modelId=card.querySelector('.pm-model-id').value.trim();if(modelId)models.push({id:card.dataset.modelId,providerId:provider.id,name:card.querySelector('.pm-model-name').value.trim()||modelId,modelId});}

  const routes={};document.querySelectorAll('.route-model').forEach(e=>{if(e.value)routes[e.dataset.role]=e.value;});

async function doDraftImport(){
  const signal=pageSignal();
  const folder=document.getElementById('draft-folder'), files=[...(folder?.files||[])];
  if(!files.length)return toast('请选择初稿文件夹、文件或压缩包','error');
  const out=document.getElementById('draft-import-out'); out.textContent='正在保存初稿附件并排队分析…';
  const fd=new FormData(); const bible=document.getElementById('draft-story-bible')?.files?.[0]; const language=document.getElementById('draft-language-plan')?.files?.[0];
  if(bible)fd.append('storyBible',bible); if(language)fd.append('languagePlan',language); files.forEach(file=>fd.append('draftFiles',file,file.webkitRelativePath||file.name));
  try{const queued=await api('POST','/books/'+encodeURIComponent(S.book)+'/draft-imports',fd,true);out.textContent=`已保存 ${queued.documentIds?.length||0} 个资料，分析任务 ${queued.taskId} 排队中…`;const task=await waitForTask(queued.taskId,t=>{out.textContent=`初稿分析 ${t.status}：${taskDetail(t)}`;});if(task.status==='completed'){out.textContent='✔ 初稿偏移分析完成，可在下方查看报告。';toast('初稿分析完成','success');}else{out.textContent=`分析未完成：${task.error||taskDetail(task)}`;toast('初稿分析失败','error');}}
  catch(e){if(e?.name==='AbortError')return;out.textContent=e.message;toast(e.message,'error');}
  finally{if(!signal?.aborted&&S.page==='import')await PAGES.import(document.getElementById('page'));}
}
async function showDraftImportReport(importId){
  try{const data=await api('GET','/books/'+encodeURIComponent(S.book)+'/draft-imports/'+encodeURIComponent(importId));const item=data.draftImport||{},r=item.report||{};const dims=(r.drift_dimensions||[]).map(x=>`<div class="card"><b>${esc(x.dimension||'未命名')} · ${esc(x.severity||'')}</b><p class="dim-note mt8">${esc(x.impact||'')}</p><p>${esc(x.recommendation||'')}</p>${(x.evidence||[]).map(e=>`<blockquote>${esc(e.source||'')}：${esc(e.quote||'')}</blockquote>`).join('')}</div>`).join('')||'<p class="dim-note">模型没有返回具体维度问题，详见局限。</p>';const plan=r.continuation_plan||{};modal(`<div class="modal-header"><div><h3>初稿偏移分析</h3><p class="dim-note">${esc(item.status||'')} · ${esc(r.verdict||'')} · 偏移分 ${r.drift_score==null?'—':esc(r.drift_score)}</p></div><button class="close-x" onclick="closeModal()">×</button></div><p>${esc(r.summary||'暂无摘要')}</p><div class="divider"></div><h4>优先级发现</h4><div class="mt16">${dims}</div><div class="divider"></div><h4>后续调整</h4><ul style="margin-left:18px;line-height:1.9">${(plan.repair_first||[]).map(x=>`<li>先修：${esc(x)}</li>`).join('')}${(plan.next_chapters||[]).map(x=>`<li>续写：${esc(x)}</li>`).join('')}${(plan.do_not_change||[]).map(x=>`<li>保留：${esc(x)}</li>`).join('')}</ul><p class="dim-note mt16">局限：${(r.limitations||[]).map(x=>esc(x)).join('；')||'模型未补充局限。'}</p>`,true);}
  catch(e){toast(e.message,'error');}
}
async function retryDraftImport(importId){
  const signal=pageSignal();
  try{const queued=await api('POST','/books/'+encodeURIComponent(S.book)+'/draft-imports/'+encodeURIComponent(importId)+'/retry');const task=await waitForTask(queued.taskId,t=>{},300,signal);if(signal?.aborted)return;toast(task.status==='completed'?'初稿分析重试完成':'初稿分析重试失败',task.status==='completed'?'success':'error');if(S.page==='import')await PAGES.import(document.getElementById('page'));}catch(e){if(e?.name!=='AbortError')toast(e.message,'error');}
}
async function doImport(){
  const signal=pageSignal();
  const f=document.getElementById('imp-file').files[0]; if(!f)return toast('请选择文件','error');
  const out=document.getElementById('imp-out'), docType=val('imp-type'); out.textContent='正在保存附件并排队…';
  const fd=new FormData(); fd.append('file',f); fd.append('docType',docType);
  try{ const queued=await api('POST','/books/'+S.book+'/documents',fd,true); out.textContent=`附件已保存，任务 ${queued.taskId} 排队中…`; const task=await waitForTask(queued.taskId,t=>{out.textContent=`解析任务 ${t.status}：${taskDetail(t)}`;}); out.textContent=`✔ 已索引 ${(task.result||{}).chunk_count??0} 个分块`; toast('文档已完成索引','success'); }
  catch(e){ if(e?.name!=='AbortError')toast(e.message,'error'); }
  finally{if(!signal?.aborted&&S.page==='import')await PAGES.import(document.getElementById('page'));}
}
async function searchRag(){
  const query=val('rag-query').trim(), out=document.getElementById('rag-out');
  if(!query)return toast('Enter a query','error');
  out.innerHTML='<div class="loading"><div class="spinner"></div>Searching…</div>';
  try{
    const type=val('rag-type'); const qs=new URLSearchParams({q:query,topK:'10'}); if(type)qs.set('docType',type);
    const payload=await api('GET','/books/'+S.book+'/rag/search?'+qs.toString());
    const state=`<div class="dim-note mb16">Strategy: <b>${esc(payload.strategy)}</b> · degraded: ${payload.degraded?'yes':'no'} · ${payload.resultCount} result(s)</div>`;
    if(!payload.results?.length){out.innerHTML=state+'<p class="dim-note">No indexed chunks matched this query.</p>';return;}
    out.innerHTML=state+payload.results.map(r=>`<details class="card" style="margin-bottom:8px"><summary><b>${esc(r.document_name)}</b> · ${esc(r.score)} · chars ${esc(r.start_char)}–${esc(r.end_char)}</summary><p class="dim-note mt16">chunk ${esc(r.chunk_id)} · document ${esc(r.document_id)} · fingerprint ${esc((r.source_fingerprint||'').slice(0,16))} · checksum ${esc((r.checksum||'').slice(0,16))}</p><pre style="white-space:pre-wrap">${esc(r.content)}</pre></details>`).join('');
  }catch(e){out.innerHTML=`<div class="warn-banner">${esc(e.message)}</div>`;}
}
async function retryDocument(documentId){
  const signal=pageSignal();
  const out=document.getElementById('imp-inspect'); out.innerHTML='<div class="loading"><div class="spinner"></div>正在重新排队…</div>';
  try{const queued=await api('POST','/books/'+S.book+'/documents/'+documentId+'/retry');const task=await waitForTask(queued.taskId,t=>{out.innerHTML=`<div class="warn-banner">重试任务 ${esc(t.status)}：${esc(taskDetail(t))}</div>`;});out.innerHTML=`<div class="success-banner">已重新建立 ${(task.result||{}).chunk_count??0} 个分块。</div>`;toast('文档重试完成','success');}
  catch(e){if(e?.name!=='AbortError')out.innerHTML=`<div class="warn-banner">${esc(e.message)}</div>`;}
  finally{if(!signal?.aborted&&S.page==='import')await PAGES.import(document.getElementById('page'));}
}
async function inspectDocument(documentId){
  const out=document.getElementById('imp-inspect'); out.innerHTML='<div class="loading"><div class="spinner"></div>正在读取分块…</div>';
  try{const [detail,response]=await Promise.all([api('GET','/books/'+S.book+'/documents/'+documentId),api('GET','/books/'+S.book+'/documents/'+documentId+'/chunks')]);const d=detail.document,chunks=response.chunks||[];out.innerHTML=`<div class="card"><h3>分块溯源：${esc(d.name)}</h3><p class="dim-note">状态 ${esc(d.status)} · SHA-256 ${esc(d.source_fingerprint)} · 解析器 ${esc(d.parser_version||'-')}</p>${d.error_code?`<p style="color:var(--error)">${esc(d.error_code)}：${esc(d.error_detail||'')}</p>`:''}<div class="mt16">${chunks.length?chunks.map(c=>`<details class="card" style="margin-bottom:8px"><summary>分块 #${c.chunk_index} · 字符 ${c.start_char}–${c.end_char} · ${esc(c.checksum.slice(0,12))}</summary><pre style="white-space:pre-wrap;margin-top:10px">${esc(c.content)}</pre></details>`).join(''):'<p class="dim-note">尚未生成分块；请等待任务完成或查看失败原因。</p>'}</div></div>`;}
  catch(e){out.innerHTML=`<div class="warn-banner">${esc(e.message)}</div>`;}
}

PAGES.tasks=async(p)=>{
