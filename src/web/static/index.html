    p.innerHTML=header('任务管理','任务管理已整合到作品下，请先打开一部作品。','<button class="btn btn-primary" onclick="go(\'dashboard\')">选择作品</button>')+'<div class="content"><div class="empty-state"><h2>请选择作品</h2><p>打开作品后，这里只展示该作品的任务、提示词、模型输出与处理记录。</p></div></div>';
    return;
  }
  let tasks=[],taskLoadError='';
  try{const r=await api('GET','/tasks?projectId='+encodeURIComponent(S.book));tasks=r.tasks||[];}catch(e){taskLoadError=e.message||'无法读取持久化任务';}
  const daemon=await api('GET','/daemon').catch(()=>({}));
  const statusCounts=tasks.reduce((a,t)=>{a[t.status]=(a[t.status]||0)+1;return a;},{});
  const activeCount=(statusCounts.running||0)+(statusCounts.queued||0)+(statusCounts.pending||0)+(statusCounts.paused||0)+(statusCounts.cancelling||0);
  p.innerHTML=header('任务管理',`${esc(bookName())} · 持久任务队列：写作、审查、修订、连续创作等后台任务实时监控`,
    `<button class="btn btn-secondary" onclick="PAGES.tasks(document.getElementById('page'))">刷新</button>`)+
  `<div class="content">
    ${taskLoadError?`<div class="warn-banner" style="border-color:var(--error);color:var(--error)"><b>任务状态读取失败。</b><span>${esc(taskLoadError)}</span><button class="btn btn-sm btn-secondary" onclick="PAGES.tasks(document.getElementById('page'))">重试</button></div>`:''}
    ${daemon.disabledByEnvironment?'<div class="warn-banner"><b>Studio Worker 被环境变量禁用。</b><span>排队任务会保留，但不会自动执行。请重启服务并取消 NOVELFORGE_DISABLE_STUDIO_WORKER。</span></div>':daemon.running?'<div class="success-banner">Studio Worker 正在运行，任务会从持久队列领取。</div>':'<div class="warn-banner"><b>没有运行中的 Studio Worker。</b><span>新任务会停留在队列中。</span><button class="btn btn-sm btn-secondary" onclick="startStudioDaemonForPage()">启动 Worker</button></div>'}
    <div class="grid grid-4 mb16">
      <div class="card stat-card"><div class="stat-value accent">${tasks.length}</div><div class="stat-label">总任务</div></div>
      <div class="card stat-card"><div class="stat-value" style="color:var(--accent)">${activeCount}</div><div class="stat-label">进行中</div></div>
      <div class="card stat-card"><div class="stat-value success">${statusCounts.completed||0}</div><div class="stat-label">已完成</div></div>
      <div class="card stat-card"><div class="stat-value" style="color:var(--error)">${statusCounts.failed||0}</div><div class="stat-label">失败</div></div>
    </div>
    <div class="card">
      <div class="card-title-row"><h3>任务列表</h3>
        <div class="row">
          <select class="input" id="task-filter-status" style="width:auto" onchange="filterTasks()">
            <option value="">全部状态</option>
            <option value="running">运行中</option><option value="queued">已排队</option>
            <option value="paused">已暂停</option><option value="needs_author_decision">需要作者决定</option><option value="completed">已完成</option>
            <option value="failed">失败</option><option value="cancelled">已取消</option>
          </select>
          <select class="input" id="task-filter-type" style="width:auto" onchange="filterTasks()">
            <option value="">全部类型</option>
            <option value="write-next">写作</option><option value="continuous">连续创作</option>
            <option value="world-bootstrap">世界观构建</option><option value="review">审查</option>
            <option value="draft">草稿</option><option value="revise">修订</option>
            <option value="joint-review">联合审查</option><option value="planning-synthesis">规划资料理解</option><option value="forecast">剧情推演</option>
          </select>
        </div>
      </div>
      <div id="task-list-container">${renderTaskList(tasks)}</div>
    </div>
  </div>`;
  // Store tasks globally for filtering
  window._allTasks=tasks;
};
function renderTaskList(tasks){
  if(!tasks.length)return '<p class="dim-note" style="padding:20px 0">暂无任务记录。</p>';
  return `<table class="table"><thead><tr><th>任务 ID</th><th>类型</th><th>状态</th><th>阶段</th><th>进度</th><th>创建时间</th><th>操作</th></tr></thead><tbody>`+
  tasks.map(t=>{
    const progress=taskProgressText(t);
    const created=t.created_at?new Date(t.created_at).toLocaleString('zh-CN'):'—';
    const actions=[];
    if(t.status==='running'){actions.push(`<button class="btn btn-sm btn-secondary" onclick="taskQueueAction('${t.id}','pause')">暂停</button>`);actions.push(`<button class="btn btn-sm btn-danger" onclick="taskQueueAction('${t.id}','cancel')">取消</button>`);}
    if(t.status==='paused'){actions.push(`<button class="btn btn-sm btn-primary" onclick="taskQueueAction('${t.id}','resume')">恢复</button>`);actions.push(`<button class="btn btn-sm btn-danger" onclick="taskQueueAction('${t.id}','cancel')">取消</button>`);}
    if(['failed','needs_author_decision'].includes(t.status)){actions.push(`<button class="btn btn-sm btn-secondary" onclick="taskQueueAction('${t.id}','retry')">从检查点继续</button>`);}
    if(t.status==='needs_author_decision'){actions.push(`<button class="btn btn-sm btn-danger" onclick="taskQueueAction('${t.id}','cancel')">结束任务</button>`);}
    if(t.status==='queued'||t.status==='pending'){actions.push(`<button class="btn btn-sm btn-danger" onclick="taskQueueAction('${t.id}','cancel')">取消</button>`);}
    actions.push(`<button class="btn btn-sm btn-ghost" onclick="showTaskDetail('${t.id}')">详情</button>`);
    return `<tr data-status="${t.status}" data-type="${t.type||''}">
      <td><span class="mono">${esc((t.id||'').slice(0,12))}</span></td>
      <td>${esc(taskTypeLabel(t.type,t))}</td>
      <td>${statusBadge(t.status)}</td>
      <td class="text-sm text-muted">${esc(taskStageLabel(t.stage||t.checkpoint?.stage,t.status))}</td>
      <td><div class="progress" style="width:80px;display:inline-block;vertical-align:middle"><div class="progress-bar" style="width:${taskProgressWidth(t)}%"></div></div> <span class="text-sm">${progress}</span></td>
      <td class="text-sm">${created}</td>
      <td><div class="row">${actions.join(' ')}</div></td>
    </tr>`;
  }).join('')+'</tbody></table>';
}
function filterTasks(){
  const status=document.getElementById('task-filter-status').value;
  const type=document.getElementById('task-filter-type').value;
  let filtered=window._allTasks||[];
  if(status)filtered=filtered.filter(t=>status==='queued'?['queued','pending'].includes(t.status):t.status===status);
  if(type)filtered=filtered.filter(t=>t.type===type);
  document.getElementById('task-list-container').innerHTML=renderTaskList(filtered);
}
async function taskQueueAction(taskId,action){
  try{
    await api('POST','/tasks/'+taskId+'/'+action);
    const labels={pause:'暂停',resume:'恢复',cancel:'取消',retry:'继续尝试'};
    toast('任务已提交“'+(labels[action]||'更新')+'”操作','success');
    await PAGES.tasks(document.getElementById('page'));
  }catch(e){toast(e.message,'error');}
}
async function authorCandidateDecision(taskId,decision){
  const label=decision==='accept'?'确认 β1 为 β':'退回审查并标记当前稿为 βn';
  if(!confirm(`确认${label}？`))return;
  try{
    const queued=await api('POST','/tasks/'+encodeURIComponent(taskId)+'/author-decision',{decision,reason:''});
    toast(decision==='accept'?'已确认 β1，正在完成事实提取与提交':'已标记 βn，正在重新进入审查', 'success');
    closeModal();
    if(window.modelWork)window.modelWork.attachTask(queued.taskId,'章节作者决定',queued);
  }catch(e){toast(e.message,'error');}
}
async function showTaskDetail(taskId){
  try{
    const t=await api('GET','/tasks/'+taskId);
    let events=[];try{const ev=await api('GET','/tasks/'+taskId+'/events');events=ev.events||[];}catch(_){}
    const checkpoint=t.checkpoint||{};
    const cpState=checkpoint.state||{};
    const cpContext=cpState.context||{};
    const canDecideBeta1=t.status==='needs_author_decision'&&['write-next','write'].includes(t.type)&&typeof cpContext.beta1_content==='string'&&cpContext.beta1_content.trim();
    const candidateDecisionHtml=canDecideBeta1?`<div class="warn-banner"><b>β1 等待作者决定</b><span>请阅读当前修订稿；确认后记作 β，退回后记作 βn 并重新进入审查。</span><div class="row row-wrap mt8"><button class="btn btn-sm btn-primary" onclick="authorCandidateDecision('${t.id}','accept')">确认 β1 为 β</button><button class="btn btn-sm btn-secondary" onclick="authorCandidateDecision('${t.id}','reject')">退回审查并记 βn</button></div></div>`:'';
    let genRuns=[];try{const gr=await api('GET','/tasks/'+taskId+'/generation-runs');genRuns=gr.runs||gr||[];}catch(_){}
    modal(`<div class="task-detail-modal"><div class="modal-header"><h3>任务详情</h3><button class="close-x" onclick="closeModal()">×</button></div>
      <div class="grid grid-2 mb16">
        <div><div class="kv"><span>任务 ID</span><b class="mono">${esc(t.id)}</b></div>
        <div class="kv"><span>类型</span><b>${esc(taskTypeLabel(t.type,t))}</b></div>
        <div class="kv"><span>状态</span><b>${statusBadge(t.status)}</b></div>
        <div class="kv"><span>阶段</span><b>${esc(taskStageLabel(t.stage||checkpoint.stage,t.status))}</b></div></div>
        <div><div class="kv"><span>进度</span><b>${esc(taskProgressText(t))}</b></div>
        <div class="kv"><span>作品</span><b>${esc(t.book_id||t.project_id||'—')}</b></div>
        <div class="kv"><span>问题提示</span><b>${esc(taskErrorText(t))}</b></div>
        <div class="kv"><span>尝试次数</span><b>${t.attempt||0}</b></div></div>
      </div>
      ${['failed','needs_author_decision'].includes(t.status)?`<div class="warn-banner"><b>${t.status==='needs_author_decision'?'任务已安全停在这里':'任务处理没有完成'}</b><span>${esc(taskErrorText(t))}</span><p class="dim-note mt8">你可以从最近一次检查点继续，也可以结束任务。</p></div>`:''}
      ${t.result?readableTaskResult(t.result,'执行结果'):''}
      ${Object.keys(cpState).length?readableTaskResult(cpState,'当前检查点'):''}
      ${genRuns.length?`<div class="card"><h3>模型处理记录</h3><p class="dim-note mb8">以下内容来自持久化模型调用记录；输入提示词保留原始文本，输出按 Markdown 渲染。</p>${genRuns.map((r,index)=>renderGenerationRun(r,index)).join('')}</div>`:''}
      ${events.length?`<div class="card"><h3>处理记录（${events.length}）</h3><div class="log-box">${events.slice(-50).map(e=>`<div class="log-line"><span class="text-muted text-sm">${e.created_at?new Date(e.created_at).toLocaleTimeString('zh-CN'):''}</span> <b>${esc(taskEventLabel(e.event_type||e.type))}</b> ${esc(taskValueText(e.payload||''))}</div>`).join('')}</div></div>`:''}
      ${candidateDecisionHtml}
      <div class="row mt16">
        ${t.status==='running'?`<button class="btn btn-secondary" onclick="taskQueueAction('${t.id}','pause');closeModal()">暂停</button><button class="btn btn-danger" onclick="taskQueueAction('${t.id}','cancel');closeModal()">取消</button>`:''}
        ${t.status==='paused'?`<button class="btn btn-primary" onclick="taskQueueAction('${t.id}','resume');closeModal()">恢复</button><button class="btn btn-danger" onclick="taskQueueAction('${t.id}','cancel');closeModal()">取消</button>`:''}
        ${['failed','needs_author_decision'].includes(t.status)?`<button class="btn btn-secondary" onclick="taskQueueAction('${t.id}','retry');closeModal()">从检查点继续</button>`:''}
        ${t.status==='needs_author_decision'?`<button class="btn btn-danger" onclick="taskQueueAction('${t.id}','cancel');closeModal()">结束任务</button>`:''}
        <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
      </div></div>`,true);
  }catch(e){toast(e.message,'error');}
}

// ===== 剧情推演 =====
PAGES.forecast=async(p)=>{
  if(!S.book)return p.innerHTML=header('剧情推演','')+'<div class="content"><div class="warn-banner">请先在「我的创作」中打开一本作品。</div></div>';
  const book=await api('GET','/books/'+S.book);
  p.innerHTML=header('剧情推演','基于当前故事状态推演未来剧情走向：生成多个可能的分支方案',
    `<button class="btn btn-primary" id="forecast-run-btn" onclick="runForecast()">开始推演</button>`)+
  `<div class="content">
    <div class="card">
      <div class="card-title-row"><h3>推演配置</h3></div>
      <div class="grid grid-3">
        <div class="field"><label>分支数量</label><input class="input" id="fc-branches" type="number" value="3" min="1" max="5"></div>
        <div class="field"><label>当前章节</label><input class="input" id="fc-chapter" type="number" value="${book.chaptersWritten||0}" min="0"></div>
        <div class="field"><label>推演深度（章）</label><input class="input" id="fc-depth" type="number" value="3" min="1" max="10"></div>
      </div>
      <div class="field"><label>附加上下文（可选）</label><textarea class="input textarea" id="fc-context" placeholder="描述你希望探索的剧情方向、约束条件等..."></textarea></div>
    </div>
    <div id="forecast-result"></div>
  </div>`;
};
async function runForecast(){
  const btn=document.getElementById('forecast-run-btn');
  const out=document.getElementById('forecast-result');
  if(btn)btn.disabled=true;
  out.innerHTML='<div class="loading"><div class="spinner"></div>正在推演剧情走向…</div>';
  try{
    const branchCount=+(document.getElementById('fc-branches')?.value||3);
    const context=document.getElementById('fc-context')?.value||'';
    const queued=await api('POST','/books/'+S.book+'/forecast',{branchCount,context});
    const task=await waitForTask(queued.taskId,t=>{
      out.innerHTML=`<div class="card"><div class="loading"><div class="spinner"></div>推演中 ${esc(taskStageLabel(t.stage,t.status))}… ${taskProgressText(t)}</div>
        <div class="progress mt8"><div class="progress-bar" style="width:${taskProgressWidth(t)}%"></div></div></div>`;
    });
    const result=task.result||{};
    const branches=result.branches||result.forecasts||[];
    if(!branches.length){
      const readable=Object.entries(result).filter(([key])=>!['raw','metadata','sourceDocuments'].includes(key)).map(([key,value])=>`<div class="list-row"><b>${esc(key)}</b><span class="text-sm text-muted">${esc(workspaceText(value)||'—')}</span></div>`).join('');
      out.innerHTML=`<div class="card"><h3>推演完成</h3>${readable||'<p class="muted">模型没有返回可展示的分支方案，请检查任务日志后重试。</p>'}</div>`;
    }else{
      out.innerHTML=`<div class="card-title" style="margin:16px 0 12px">推演结果：${branches.length} 个分支方案</div>`+
      branches.map((b,i)=>`<div class="card" style="border-left:3px solid ${['var(--primary)','var(--accent)','var(--success)','var(--warning)','var(--error)'][i%5]}">
        <div class="card-title-row"><h3>分支 ${i+1}：${esc(b.title||b.name||'方案'+(i+1))}</h3>
          ${b.score!==undefined?`<span class="badge ${b.score>=80?'badge-success':b.score>=60?'badge-warning':'badge-error'}">评分 ${b.score}</span>`:''}</div>
        ${b.summary?`<p class="dim-note mb16">${esc(b.summary)}</p>`:''}
        ${b.plot_points?`<div class="mb16">${(b.plot_points||[]).map((pp,j)=>`<div class="list-row"><span class="badge badge-muted">${j+1}</span><span>${esc(typeof pp==='string'?pp:pp.description||pp.title||taskValueText(pp))}</span></div>`).join('')}</div>`:''}
        ${b.risks?`<div class="warn-banner" style="margin-top:8px">风险提示：${esc(typeof b.risks==='string'?b.risks:b.risks.join('；'))}</div>`:''}
        ${b.narrative?`<div style="margin-top:12px;line-height:1.8;font-size:14px">${esc(b.narrative)}</div>`:''}
      </div>`).join('');
    }
    toast('剧情推演完成','success');
  }catch(e){out.innerHTML=`<div class="warn-banner">${esc(e.message)}</div>`;}
  finally{if(btn)btn.disabled=false;}
}

// ===== 系统诊断 =====
PAGES.doctor=async(p)=>{
  const d=await api('GET','/doctor');
  const icon=s=>s==='ok'?'<span style="color:var(--success)">✔</span>':s==='warning'?'<span style="color:var(--warning)">⚠</span>':'<span style="color:var(--error)">✘</span>';
  p.innerHTML=header('系统诊断','检查模型配置、项目目录等运行环境',`<button class="btn btn-secondary" onclick="go('doctor')">重新检测</button>`)+
  `<div class="content"><div class="card"><table class="table"><tbody>
    ${(d.checks||[]).map(c=>`<tr><td style="width:40px">${icon(c.status)}</td><td><b>${esc(c.name)}</b></td><td class="text-muted">${esc(c.message)}</td></tr>`).join('')}
  </tbody></table></div></div>`;
};

    const script=document.createElement('script');
    script.src=primary;
    script.onload=next;
    script.onerror=function(){
      const fallbackScript=document.createElement('script');
      fallbackScript.src=fallback;
      fallbackScript.onload=next;
      document.body.appendChild(fallbackScript);
    };
    document.body.appendChild(script);
  }
  loadStudioAsset('/static/studio-shell.js?v=20260821-workbench-7','studio-shell.js',function(){
    loadStudioAsset('/static/studio-enhancements.js?v=20260812-model-progress-2','studio-enhancements.js',function(){
      loadStudioAsset('/static/studio-visual.js?v=20260814-paper-default-2','studio-visual.js',function(){
        loadStudioAsset('/static/studio-storyflow.js?v=20260821-workspace-lifecycle-2','studio-storyflow.js',function(){
          loadStudioAsset('/static/studio-simulation.js?v=20260820-simulation-audit-4','studio-simulation.js',function(){
            if(typeof window.startStudioShell==='function') window.startStudioShell();
            if(typeof window.__studioStartLegacyBoot==='function') window.__studioStartLegacyBoot();
          });
        });
      });
    });
  });
})();
</script>
