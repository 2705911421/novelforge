<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovelForge Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e94560'/%3E%3Cpath d='M18 15h28v34H18z' fill='%23ffffff'/%3E%3Cpath d='M25 23h14M25 31h14M25 39h9' stroke='%23e94560' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js"></script>
<style>
:root{
--bg:#0d1117;--bg-card:#161b22;--bg-hover:#1c2128;--bg-elevated:#21262d;
--text:#e6edf3;--text-muted:#8b949e;--text-dim:#484f58;
--primary:#e94560;--primary-hover:#d63851;--primary-dim:rgba(233,69,96,.15);
--secondary:#21262d;--border:#30363d;--border-light:#3d444d;
--success:#3fb950;--warning:#d29922;--error:#f85149;--accent:#58a6ff;
--radius:12px;--radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.app{display:flex;height:100vh;overflow:hidden}
/* Sidebar */
.sidebar{width:248px;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:18px 20px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:19px;background:linear-gradient(135deg,#e94560,#58a6ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800}
.sidebar-header p{font-size:11px;color:var(--text-muted);margin-top:2px}
.sidebar-nav{flex:1;padding:10px;overflow-y:auto}
.nav-section{margin:14px 8px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-muted);transition:all .15s;margin-bottom:1px;font-size:13.5px;user-select:none}
.nav-item:hover{background:var(--bg-hover);color:var(--text)}
.nav-item.active{background:var(--primary-dim);color:var(--primary);font-weight:600}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success)}
.dot.off{background:var(--text-dim);box-shadow:none}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{padding:15px 26px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;min-height:60px}
.header h2{font-size:18px;font-weight:700}
.header .sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.content{flex:1;overflow-y:auto;padding:24px 26px}
.content-narrow{max-width:820px}
/* Buttons */
.btn{padding:8px 15px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-secondary{background:var(--secondary);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn-ghost{background:transparent;color:var(--text-muted)}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:transparent;color:var(--error);border:1px solid var(--border)}
.btn-danger:hover{background:rgba(248,81,73,.12);border-color:var(--error)}
/* Cards */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card-hover{transition:all .15s;cursor:pointer}
.card-hover:hover{border-color:var(--accent);transform:translateY(-2px)}
.card h3{font-size:15px;margin-bottom:12px;font-weight:700}
.card-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-title-row h3{margin-bottom:0}
/* Inputs */
.field{margin-bottom:16px}
.field label{display:block;margin-bottom:6px;color:var(--text-muted);font-size:12.5px;font-weight:500}
.input{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13.5px;font-family:inherit;transition:border-color .15s}
.input:focus{outline:none;border-color:var(--accent)}
.textarea{min-height:110px;resize:vertical;line-height:1.6}
select.input{cursor:pointer}
/* Layout */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center}
.row-wrap{flex-wrap:wrap}
.spacer{flex:1}
/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge-success{background:rgba(63,185,80,.16);color:var(--success)}
.badge-warning{background:rgba(210,153,34,.16);color:var(--warning)}
.badge-error{background:rgba(248,81,73,.16);color:var(--error)}
.badge-info{background:rgba(88,166,255,.16);color:var(--accent)}
.badge-muted{background:var(--secondary);color:var(--text-muted)}
/* Progress */
.progress{height:6px;background:var(--secondary);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),#58a6ff);transition:width .4s;border-radius:3px}
/* Stat */
.stat-card{text-align:center;padding:22px}
.stat-value{font-size:30px;font-weight:800;color:var(--primary)}
.stat-value.accent{color:var(--accent)}
.stat-value.success{color:var(--success)}
.stat-label{color:var(--text-muted);margin-top:6px;font-size:12.5px}
/* Table */
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
.table th{color:var(--text-muted);font-weight:600;font-size:12px}
.table tr:hover td{background:var(--bg-hover)}
/* Empty */
.empty-state{text-align:center;padding:70px 20px;color:var(--text-muted)}
.empty-state svg{width:60px;height:60px;margin-bottom:16px;opacity:.25}
.empty-state h2{font-size:17px;margin-bottom:8px;color:var(--text)}
/* Spinner */
.loading{display:flex;align-items:center;justify-content:center;padding:44px;gap:12px;color:var(--text-muted)}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(2px)}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:640px;width:92%;max-height:86vh;overflow-y:auto}
.modal-lg{max-width:900px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-header h3{font-size:17px}
.close-x{cursor:pointer;color:var(--text-muted);font-size:22px;line-height:1;background:none;border:none}
.close-x:hover{color:var(--text)}
/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:0;flex-wrap:wrap}
.tab{padding:8px 15px;cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
/* Toast */
.toast-wrap{position:fixed;top:18px;right:18px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:var(--radius-sm);background:var(--bg-elevated);border:1px solid var(--border);border-left:3px solid var(--accent);min-width:260px;max-width:380px;font-size:13px;animation:slidein .25s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--error)}
.toast.warning{border-left-color:var(--warning)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
/* Misc */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--secondary);border-radius:20px;font-size:12px;margin:2px}
.divider{height:1px;background:var(--border);margin:16px 0}
.mono{font-family:'SF Mono',Consolas,monospace;font-size:12.5px}
.scroll-y{overflow-y:auto}
.text-muted{color:var(--text-muted)}
.text-sm{font-size:12.5px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.dim-note{font-size:12px;color:var(--text-dim);line-height:1.5}
.warn-banner{background:rgba(210,153,34,.12);border:1px solid rgba(210,153,34,.3);color:var(--warning);padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;line-height:1.5;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start}
.gate-box{display:flex;gap:10px;margin:10px 0}
.gate{flex:1;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);text-align:center}
.gate.pass{border-color:var(--success);background:rgba(63,185,80,.08)}
.gate.fail{border-color:var(--error);background:rgba(248,81,73,.08)}
.gate .g-label{font-size:11px;color:var(--text-muted)}
.gate .g-val{font-size:18px;font-weight:700;margin-top:4px}
.mermaid-box{background:#fff;border-radius:var(--radius);padding:16px;overflow:auto}
.log-line{padding:5px 10px;border-radius:6px;font-size:12.5px;margin-bottom:3px;font-family:'SF Mono',Consolas,monospace;background:var(--bg);border-left:2px solid var(--border)}
.log-line.active{border-left-color:var(--accent);background:var(--primary-dim)}
.timeline-wrap{position:relative;padding-left:24px}
.timeline-wrap::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-node{position:relative;margin-bottom:18px}
.tl-node::before{content:'';position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid var(--bg)}
.editor-layout{display:grid;grid-template-columns:1fr 320px;gap:16px}
@media(max-width:1100px){.editor-layout{grid-template-columns:1fr}.grid-4{grid-template-columns:repeat(2,1fr)}}
.score-ring{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv span{color:var(--text-muted)}
.kv b{color:var(--text);text-align:right}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.list-row:last-child{border-bottom:none}
.muted{color:var(--text-muted)}
.book-card{cursor:pointer;transition:all .15s}
.book-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.book-cover{width:100%;height:88px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary-dim),rgba(88,166,255,.15));display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:var(--primary);margin-bottom:12px}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px}
.fld{display:block;margin-bottom:14px;font-size:12.5px;color:var(--text-muted);font-weight:500}
.fld .input,.fld .ta{margin-top:6px}
.ta{min-height:90px;resize:vertical;line-height:1.6;width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13.5px;font-family:inherit}
.prog{height:8px;background:var(--secondary);border-radius:4px;overflow:hidden;margin-bottom:6px}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--primary),#58a6ff);transition:width .4s;border-radius:4px}
.log-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;height:220px;overflow-y:auto;font-size:12px}
/* extra */
.muted{color:var(--text-muted)}
.card-title{font-size:15px;margin-bottom:12px;font-weight:700}
.fld{display:block;margin-bottom:14px;color:var(--text-muted);font-size:12.5px;font-weight:500}
.fld .input{margin-top:6px}
.ta{min-height:90px;resize:vertical;line-height:1.6}
.prog{height:8px;background:var(--secondary);border-radius:4px;overflow:hidden;margin-bottom:6px}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--primary),#58a6ff);transition:width .4s;border-radius:4px;width:0}
.log-box{max-height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--text-muted)}
.list-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.list-row:last-child{border-bottom:none}
.book-card{cursor:pointer;transition:all .15s}
.book-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.book-cover{width:48px;height:48px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin-bottom:10px}
.node-tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--secondary);font-size:11px;margin-left:6px}
.fs-card{border-left:3px solid var(--accent);padding:12px 14px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:10px}
.fs-card.planted{border-left-color:var(--warning)}
.fs-card.paid{border-left-color:var(--success)}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="sidebar-header">
<h1>NovelForge</h1>
<p>AI 长篇小说创作平台</p>
</div>
<nav class="sidebar-nav" id="nav"></nav>
<div class="sidebar-footer">
<span class="dot" id="conn-dot"></span>
<span id="conn-text">实时同步就绪</span>
</div>
</aside>
<main class="main">
<div id="page" style="display:flex;flex-direction:column;height:100%;overflow:hidden"></div>
</main>
</div>
<div class="toast-wrap" id="toasts"></div>
<div id="modal-root"></div>
<script>
mermaid.initialize({startOnLoad:false,theme:'default',securityLevel:'loose',flowchart:{curve:'basis'}});

// ===== State =====
const ACTIVE_BOOK_KEY='novelforge-active-book';
const ACTIVE_PAGE_KEY='novelforge-active-page';
const WRITE_TASK_KEY='novelforge-write-task-';
const S = { page:localStorage.getItem(ACTIVE_PAGE_KEY)||'dashboard', book:localStorage.getItem(ACTIVE_BOOK_KEY), books:[], tab:{}, sse:null, activeTasks:{} };

// ===== Nav definition =====
const NAV = [
  {sec:'创作'},
  {id:'dashboard',label:'我的创作',icon:'M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z'},
  {id:'create',label:'新建作品',icon:'M12 5v14M5 12h14'},
  {id:'chat',label:'AI 助手',icon:'M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z'},
  {sec:'当前作品',bookOnly:true},
  {id:'book',label:'作品概览',icon:'M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z',bookOnly:true},
  {id:'wizard',label:'世界观向导',icon:'M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 17l-6.3 4.4L8 14 2 9.4h7.6z',bookOnly:true},
  {id:'chapters',label:'章节工作台',icon:'M4 19.5A2.5 2.5 0 016.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z',bookOnly:true},
  {id:'continuous',label:'连续创作',icon:'M5 3l14 9-14 9V3z',bookOnly:true},
  {id:'mindmap',label:'思维导图',icon:'M18 8a3 3 0 10-6 0 M6 12a3 3 0 106 0 M18 16a3 3 0 10-6 0 M9 12h6 M15 8l-3 4 3 4',bookOnly:true},
  {id:'timeline',label:'故事时间轴',icon:'M12 8v4l3 3 M12 2a10 10 0 100 20 10 10 0 000-20z',bookOnly:true},
  {id:'foreshadowing',label:'伏笔与钩子',icon:'M9 18V5l12-2v13 M6 15a3 3 0 100 6 3 3 0 000-6z M18 13a3 3 0 100 6 3 3 0 000-6z',bookOnly:true},
  {id:'characters',label:'人物关系',icon:'M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2 M9 11a4 4 0 100-8 4 4 0 000 8 M23 21v-2a4 4 0 00-3-3.87 M16 3.13a4 4 0 010 7.75',bookOnly:true},
  {id:'analytics',label:'数据分析',icon:'M18 20V10 M12 20V4 M6 20v-6',bookOnly:true},
  {id:'jointreview',label:'联合审查',icon:'M9 11l3 3L22 4 M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11',bookOnly:true},
  {id:'truth',label:'真相文件',icon:'M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6',bookOnly:true},
  {id:'forecast',label:'剧情推演',icon:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z M12 9a3 3 0 100 6 3 3 0 000-6z',bookOnly:true},
  {id:'export',label:'导出交付',icon:'M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4 M7 10l5 5 5-5 M12 15V3',bookOnly:true},
  {sec:'系统'},
  {id:'tasks',label:'任务管理',icon:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2 M9 3h6a2 2 0 012 2v0a2 2 0 01-2 2H9a2 2 0 01-2-2v0a2 2 0 012-2z'},
  {id:'genres',label:'题材库',icon:'M4 19.5A2.5 2.5 0 016.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z'},
  {id:'services',label:'模型配置',icon:'M12 15a3 3 0 100-6 3 3 0 000 6z M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-2.82 1.17V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15H4.5a2 2 0 110-4h.09A1.65 1.65 0 006.4 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 0011 4.6V4.5a2 2 0 114 0v.09A1.65 1.65 0 0018 6.4l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0021 11h.09a2 2 0 110 4H21z'},
  {id:'settings',label:'创作参数',icon:'M12 20h9 M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z'},
  {id:'import',label:'导入素材',icon:'M12 3v12 M8 11l4 4 4-4 M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4'},
  {id:'doctor',label:'系统诊断',icon:'M22 12h-4l-3 9L9 3l-3 9H2'},
];

// ===== API =====
async function api(method, path, body, isForm){
  const opts={method,headers:{}};
  if(body && !isForm){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
  if(isForm){opts.body=body;}
  const res=await fetch('/api/v1'+path,opts);
  if(!res.ok){const e=await res.json().catch(()=>({detail:res.statusText}));const detail=e.detail||e.message||'请求失败';throw new Error(typeof detail==='string'?detail:(detail.message||detail.code||'请求失败'));}
  const ct=res.headers.get('content-type')||'';
  return ct.includes('json')?res.json():res.text();
}

// ===== Toast =====
function toast(msg,type){
  const el=document.createElement('div');
  el.className='toast '+(type||'');
  el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},3600);
}

// ===== Modal =====
function modal(html,large){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal ${large?'modal-lg':''}">${html}</div></div>`;
}

// ===== Helpers =====
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function scoreColor(s){return s>=93?'var(--success)':s>=80?'var(--warning)':'var(--error)';}
function statusBadge(st){
  const m={approved:['badge-success','已通过'],reviewing:['badge-warning','审查中'],draft:['badge-muted','草稿'],writing:['badge-info','创作中'],revising:['badge-warning','修订中'],queued:['badge-info','已排队'],running:['badge-info','运行中'],paused:['badge-warning','已暂停'],cancelling:['badge-warning','取消中'],completed:['badge-success','已完成'],failed:['badge-error','失败'],cancelled:['badge-muted','已取消'],needs_author_decision:['badge-error','需要作者决定']};
  const x=m[st]||['badge-muted',st||'—'];return `<span class="badge ${x[0]}">${x[1]}</span>`;
}

let _contTask=null;
async function startContinuous(){
  const count = +val('c-count'), start = +val('c-start');
  const score = +val('c-score'), interval = +val('c-interval');
  const context = val('c-context');
  if(count<5||count>200) return toast('篇目需在 5 到 200 之间','error');
  if(!confirm(`确认连续创作 ${count} 章？该模式会对每章反复审查、修订、复审并每 ${interval} 章联合审查，将消耗大量 token。`)) return;
  try{ await api('PUT','/project',{passScore:score,jointReviewInterval:interval}); }catch(e){}
  const box=document.getElementById('c-log'); if(box) box.innerHTML='';
  document.getElementById('c-start-btn').disabled=true;
  logLine('提交连续创作任务...');
  try{
    const res = await api('POST','/books/'+S.book+'/continuous',{count,startChapter:start,context});
    _contTask = res.taskId;
    localStorage.setItem('novelforge-continuous-'+S.book,_contTask);
    logLine('任务已启动: '+res.taskId+' — 开始监听进度');
    window.addEventListener('task-update',onContUpdate);
    pollTask(res.taskId);
  }catch(e){ toast(e.message,'error'); document.getElementById('c-start-btn').disabled=false; }
}
function onContUpdate(ev){ const t=ev.detail; if(_contTask && t.id===_contTask) renderTaskProgress(t); }
function logLine(t){
  const box=document.getElementById('c-log'); if(!box) return;
  const d=document.createElement('div'); d.className='log-line';
  d.textContent='· '+t; box.appendChild(d); box.scrollTop=box.scrollHeight;
}
function stopContinuous(){ window.removeEventListener('task-update',onContUpdate); _contTask=null; logLine('已停止监听（后台任务继续运行）'); }
async function taskAction(action){
  if(!_contTask)return;
  try{await api('POST','/tasks/'+_contTask+'/'+action);toast('任务状态已更新','success');pollTask(_contTask);}
  catch(e){toast(e.message,'error');}
}
function renderTaskActions(t){
  const el=document.getElementById('c-task-actions'); if(!el)return;
  const actions=[];
  if(t.status==='running') actions.push(`<button class="btn btn-sm btn-secondary" onclick="taskAction('pause')">暂停</button>`,`<button class="btn btn-sm btn-danger" onclick="taskAction('cancel')">取消</button>`);
  if(t.status==='paused') actions.push(`<button class="btn btn-sm btn-primary" onclick="taskAction('resume')">恢复</button>`,`<button class="btn btn-sm btn-danger" onclick="taskAction('cancel')">取消</button>`);
  if(t.status==='failed') actions.push(`<button class="btn btn-sm btn-secondary" onclick="taskAction('retry')">重试</button>`);
  el.innerHTML=`${statusBadge(t.status)}<span class="dim-note">阶段：${esc(t.stage||'queued')}</span>${actions.join('')}`;
}
async function pollTask(id){
  if(!id) return;
  try{
    const t = await api('GET','/tasks/'+id);
    renderTaskProgress(t);
    renderTaskActions(t);
    if(['queued','running','cancelling'].includes(t.status)){ setTimeout(()=>pollTask(id),2000); }
    else if(t.status==='completed'){ logLine('✔ 全部完成'); renderTaskResults(t); }
    else if(t.status==='failed'){ logLine('✘ 失败: '+(t.error||'')); }
  }catch(e){ setTimeout(()=>pollTask(id),3000); }
}
let _lastProg='';
function renderTaskProgress(t){
  const total=t.data?.count||1, done=(t.result?.chapters||[]).length;
  const bar=document.getElementById('c-bar'); if(bar) bar.style.width=Math.round(done/total*100)+'%';
  const checkpoint=t.checkpoint?.state||{};
  const stat=document.getElementById('c-stat'); if(stat) stat.textContent=`${t.status} · 阶段：${t.stage||'queued'}${checkpoint.message?(' · '+checkpoint.message):''}`;
  const p=checkpoint.message||checkpoint.chapter_number?`检查点：${checkpoint.message||('第 '+checkpoint.chapter_number+' 章')}`:'';
  if(p && p!==_lastProg){ _lastProg=p; logLine(p); }
  const tb=document.querySelector('#c-table tbody');
  if(tb && t.chapters){ tb.innerHTML=t.chapters.map(c=>`<tr><td>${c.number}</td><td>${esc(c.title||'')}</td><td>${c.score??'-'}</td><td>${c.revision_rounds??'-'}</td><td>${c.passed?'<span class="badge badge-success">通过</span>':'<span class="badge badge-warning">保留</span>'}</td></tr>`).join(''); }
}
function renderTaskResults(t){
  const r=t.result; if(!r) return;
  const tb=document.querySelector('#c-table tbody');
  if(tb && r.chapters){ tb.innerHTML=r.chapters.map(c=>`<tr><td>${c.number}</td><td>${esc(c.title||'')}</td><td>${c.score??'-'}</td><td>${c.revision_rounds??'-'}</td><td>${c.passed?'<span class="badge badge-success">通过</span>':'<span class="badge badge-warning">保留</span>'}</td></tr>`).join(''); }
  if(r.joint_reviews && r.joint_reviews.length) logLine('联合审查: '+r.joint_reviews.map(j=>`${j.range}(${j.score})`).join(', '));
}

async function writeNext(){

async function monitorWriteTask(tid){
  const s=document.getElementById('wn-status'); if(!s)return;
  try{
    const t=await api('GET','/tasks/'+tid); S.activeTasks[tid]=t;
    const detail=t.error||t.error_code||(typeof t.progress==='string'&&t.progress)||t.status||'处理中';
    const failed=t.status==='failed'||t.status==='needs_author_decision';
    s.innerHTML=`<div class="warn-banner"${failed?' style="border-color:var(--error);color:var(--error)"':''}>✍ 任务 ${esc(t.id)}：${esc(detail)}</div>`;
    if(['queued','running','paused','cancelling'].includes(t.status)) setTimeout(()=>monitorWriteTask(tid),2000);
    else if(t.status==='completed'){localStorage.removeItem(WRITE_TASK_KEY+S.book);toast('新章节完成','success');go('chapters');}
  }catch(e){
    s.innerHTML=`<div class="warn-banner" style="border-color:var(--error);color:var(--error)">✘ 无法读取任务 ${esc(tid)}：${esc(e.message)}</div>`;
  }
}
function taskDetail(task){
  return task.error || task.error_code || task.checkpoint?.state?.message || task.stage || task.status || '处理中';
}
async function waitForTask(taskId, renderStatus){
  while(true){
    const task=await api('GET','/tasks/'+taskId); S.activeTasks[taskId]=task;
    if(renderStatus)renderStatus(task);
    if(task.status==='completed')return task;
    if(['failed','cancelled','needs_author_decision'].includes(task.status)){
      throw new Error(task.error || task.error_code || `任务${task.status}`);
    }
    await new Promise(resolve=>setTimeout(resolve,1000));
  }
}

function openChapterEditor(num,chapter,isNew){
  const title=chapter.title||'', content=chapter.content||'';
  const AUTOSAVE_KEY=`novelforge-autosave-${S.book}-${num}`;
  // Restore from autosave if available
  let restoredContent=content;
  let restoredTitle=title;
  try{
    const saved=JSON.parse(localStorage.getItem(AUTOSAVE_KEY)||'null');
    if(saved&&saved.content&&isNew){restoredContent=saved.content;restoredTitle=saved.title||title;}
  }catch(e){}
  modal(`<div class="modal-header"><h3>${isNew?'新建':'编辑'}第${num}章</h3><div id="autosave-indicator" style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px"><span id="autosave-dot" style="width:8px;height:8px;border-radius:50%;background:var(--success)"></span><span id="autosave-text">已保存</span></div><button class="close-x" onclick="closeChapterEditorSafe(${num})">×</button></div>
    <div class="field"><label>章节号</label><input class="input" id="chapter-editor-number" type="number" min="1" value="${num}" ${isNew?'':'disabled'}></div>
    <div class="field"><label>标题</label><input class="input" id="chapter-editor-title" value="${escAttr(restoredTitle)}" placeholder="章节标题"></div>
    <div class="field"><label>正文</label><textarea class="input textarea" id="chapter-editor-content" style="min-height:42vh" placeholder="在此直接写作…">${esc(restoredContent)}</textarea></div>
    <div class="row row-wrap"><button class="btn btn-primary" id="chapter-editor-save" data-base-version="${Number(chapter.version||0)}" onclick="saveChapterEditor()">保存新版本</button>
    ${isNew?'':`<button class="btn btn-secondary" onclick="showChapterVersions(${num})">版本历史</button>`}
    ${isNew?'':`<button class="btn btn-danger" onclick="deleteChapterFromEditor(${num})">删除章节</button>`}</div>`,true);
  // Auto-save state
  let _isDirty=false, _debounceTimer=null, _saveCount=0, _lastSaveTime=null;
  const contentEl=document.getElementById('chapter-editor-content');
  const titleEl=document.getElementById('chapter-editor-title');
  const dotEl=document.getElementById('autosave-dot');
  const textEl=document.getElementById('autosave-text');
  function markDirty(){_isDirty=true;if(dotEl)dotEl.style.background='var(--warning)';if(textEl)textEl.textContent='未保存';}
  function markClean(){_isDirty=false;if(dotEl)dotEl.style.background='var(--success)';if(textEl)textEl.textContent='已保存';_lastSaveTime=new Date();_saveCount++;}
  function doAutoSave(){
    try{
      const data=JSON.stringify({title:titleEl?.value||'',content:contentEl?.value||'',timestamp:Date.now(),saveCount:_saveCount});
      localStorage.setItem(AUTOSAVE_KEY,data);
      markClean();
    }catch(e){if(dotEl)dotEl.style.background='var(--error)';if(textEl)textEl.textContent='保存失败';}
  }
  function scheduleSave(){clearTimeout(_debounceTimer);markDirty();_debounceTimer=setTimeout(doAutoSave,2000);}
  if(contentEl)contentEl.addEventListener('input',scheduleSave);
  if(titleEl)titleEl.addEventListener('input',scheduleSave);
  // beforeunload handler
  const unloadHandler=function(e){if(_isDirty){e.preventDefault();e.returnValue='';}};
  window.addEventListener('beforeunload',unloadHandler);
  // Store cleanup function
  window._chapterEditorCleanup=function(){
    window.removeEventListener('beforeunload',unloadHandler);
    clearTimeout(_debounceTimer);
    window._chapterEditorCleanup=null;
  };
  // Auto-save every 30s even if not dirty
  const autoInterval=setInterval(()=>{if(contentEl?.value)doAutoSave();},30000);
  window._chapterEditorAutoInterval=autoInterval;
}
async function saveChapterEditor(){
  const number=Number(val('chapter-editor-number')), title=val('chapter-editor-title'), content=val('chapter-editor-content');
  if(!Number.isInteger(number)||number<1)return toast('章节号必须为正整数','error');
  const button=document.getElementById('chapter-editor-save'); button.disabled=true; button.textContent='保存中…';
  try{
    const baseVersion=Number(button?.dataset.baseVersion||0);
    const payload={title,content};
    if(baseVersion>0)payload.baseVersion=baseVersion;
    await api('PUT','/books/'+S.book+'/chapters/'+number,payload);
    // Clear autosave after successful save
    try{localStorage.removeItem(`novelforge-autosave-${S.book}-${number}`);}catch(e){}
    if(window._chapterEditorCleanup)window._chapterEditorCleanup();
    clearInterval(window._chapterEditorAutoInterval);
    closeModal(); toast('章节已保存为新版本','success'); go('chapters');
  }catch(e){ toast(e.message,'error'); button.disabled=false; button.textContent='保存新版本'; }
}
function closeChapterEditorSafe(num){
  if(window._chapterEditorCleanup)window._chapterEditorCleanup();
  clearInterval(window._chapterEditorAutoInterval);
  closeModal();
}
async function showChapterVersions(number){
  try{
    const result=await api('GET','/books/'+S.book+'/chapters/'+number+'/versions');
    const versions=result.versions||[];

  </div>`;

function drawScoreChart(scores){
  const cv=document.getElementById('score-chart'); if(!cv)return;
  const ctx=cv.getContext('2d'); const W=cv.width=cv.offsetWidth; const H=cv.height=320;
  ctx.clearRect(0,0,W,H); if(!scores.length){ctx.fillStyle='#8b949e';ctx.fillText('暂无评分数据',20,40);return;}
  const pad=40, maxN=scores.length, minS=60, maxS=100;
  const x=i=>pad+(W-2*pad)*(maxN<=1?0.5:i/(maxN-1));
  const y=s=>H-pad-(H-2*pad)*((Math.max(minS,Math.min(maxS,s))-minS)/(maxS-minS));
  // gridlines + pass line at 93
  ctx.strokeStyle='#30363d';ctx.lineWidth=1;
  [60,70,80,90,100].forEach(g=>{ctx.beginPath();ctx.moveTo(pad,y(g));ctx.lineTo(W-pad,y(g));ctx.stroke();ctx.fillStyle='#484f58';ctx.font='10px sans-serif';ctx.fillText(g,4,y(g)+3);});
  ctx.strokeStyle='#3fb950';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pad,y(93));ctx.lineTo(W-pad,y(93));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#3fb950';ctx.fillText('通过线 93',W-pad-56,y(93)-4);
  // line
  ctx.strokeStyle='#e94560';ctx.lineWidth=2;ctx.beginPath();
  scores.forEach((s,i)=>{const px=x(i),py=y(s.score);i?ctx.lineTo(px,py):ctx.moveTo(px,py);});ctx.stroke();
  scores.forEach((s,i)=>{const px=x(i),py=y(s.score);ctx.fillStyle=s.score>=93?'#3fb950':s.score>=80?'#d29922':'#f85149';ctx.beginPath();ctx.arc(px,py,3.5,0,7);ctx.fill();});
}

async function searchRag(){

    const type=val('rag-type'); const qs=new URLSearchParams({q:query,topK:'10'}); if(type)qs.set('docType',type);

function renderTaskList(tasks){
  if(!tasks.length)return '<p class="dim-note" style="padding:20px 0">暂无任务记录。</p>';
  const sorted=[...tasks].sort((a,b)=>{
    const order={running:0,queued:1,paused:2,cancelling:3,needs_author_decision:4,failed:5,completed:6,cancelled:7};
    return (order[a.status]??9)-(order[b.status]??9);
  });
  return `<table class="table"><thead><tr><th>任务 ID</th><th>类型</th><th>状态</th><th>阶段</th><th>进度</th><th>创建时间</th><th>操作</th></tr></thead><tbody>`+
  sorted.map(t=>{
    const progress=t.total_steps?t.progress+'%':'—';
    const created=t.created_at?new Date(t.created_at).toLocaleString('zh-CN'):'—';
    const actions=[];
    if(t.status==='running'){actions.push(`<button class="btn btn-sm btn-secondary" onclick="taskAction('${t.id}','pause')">暂停</button>`);actions.push(`<button class="btn btn-sm btn-danger" onclick="taskAction('${t.id}','cancel')">取消</button>`);}
    if(t.status==='paused'){actions.push(`<button class="btn btn-sm btn-primary" onclick="taskAction('${t.id}','resume')">恢复</button>`);actions.push(`<button class="btn btn-sm btn-danger" onclick="taskAction('${t.id}','cancel')">取消</button>`);}
    if(t.status==='failed'){actions.push(`<button class="btn btn-sm btn-secondary" onclick="taskAction('${t.id}','retry')">重试</button>`);}
    if(t.status==='queued'){actions.push(`<button class="btn btn-sm btn-danger" onclick="taskAction('${t.id}','cancel')">取消</button>`);}
    actions.push(`<button class="btn btn-sm btn-ghost" onclick="showTaskDetail('${t.id}')">详情</button>`);
    return `<tr data-status="${t.status}" data-type="${t.type||''}">
      <td><span class="mono">${esc((t.id||'').slice(0,12))}</span></td>
      <td>${esc(t.type||'—')}</td>
      <td>${statusBadge(t.status)}</td>
      <td class="text-sm text-muted">${esc(t.stage||t.checkpoint?.stage||'—')}</td>
      <td><div class="progress" style="width:80px;display:inline-block;vertical-align:middle"><div class="progress-bar" style="width:${progress==='—'?'0':progress}"></div></div> <span class="text-sm">${progress}</span></td>
      <td class="text-sm">${created}</td>
      <td><div class="row">${actions.join(' ')}</div></td>
    </tr>`;
  }).join('')+'</tbody></table>';
}
function filterTasks(){
  const status=document.getElementById('task-filter-status').value;
  const type=document.getElementById('task-filter-type').value;
  let filtered=window._allTasks||[];
  if(status)filtered=filtered.filter(t=>t.status===status);
  if(type)filtered=filtered.filter(t=>t.type===type);
  document.getElementById('task-list-container').innerHTML=renderTaskList(filtered);
}

      ${t.result?`<div class="card"><h3>执行结果</h3><pre style="white-space:pre-wrap;font-size:12px">${esc(JSON.stringify(t.result,null,2))}</pre></div>`:''}
      ${Object.keys(cpState).length?`<div class="card"><h3>检查点状态</h3><pre style="white-space:pre-wrap;font-size:12px">${esc(JSON.stringify(cpState,null,2))}</pre></div>`:''}
      ${genRuns.length?`<div class="card"><h3>生成运行记录</h3>${genRuns.map(r=>`<div class="list-row"><span class="mono text-sm">${esc((r.id||'').slice(0,8))}</span><span class="text-sm">${esc(r.model_id||'—')}</span><span class="text-sm">${r.tokens_in||0}→${r.tokens_out||0} tokens</span><span class="text-sm">${r.latency_ms||0}ms</span>${r.error?`<span style="color:var(--error)" class="text-sm">${esc(r.error)}</span>`:''}</div>`).join('')}</div>`:''}
      ${events.length?`<div class="card"><h3>事件日志 (${events.length})</h3><div class="log-box">${events.slice(-50).map(e=>`<div class="log-line"><span class="text-muted text-sm">${e.created_at?new Date(e.created_at).toLocaleTimeString('zh-CN'):''}</span> <b>${esc(e.event_type||e.type||'')}</b> ${esc(typeof e.payload==='string'?e.payload:JSON.stringify(e.payload||''))}</div>`).join('')}</div></div>`:''}
      <div class="row mt16">
        ${t.status==='running'?`<button class="btn btn-secondary" onclick="taskAction('${t.id}','pause');closeModal()">暂停</button><button class="btn btn-danger" onclick="taskAction('${t.id}','cancel');closeModal()">取消</button>`:''}
        ${t.status==='paused'?`<button class="btn btn-primary" onclick="taskAction('${t.id}','resume');closeModal()">恢复</button><button class="btn btn-danger" onclick="taskAction('${t.id}','cancel');closeModal()">取消</button>`:''}
        ${t.status==='failed'?`<button class="btn btn-secondary" onclick="taskAction('${t.id}','retry');closeModal()">重试</button>`:''}
        <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
      </div>`,true);
  }catch(e){toast(e.message,'error');}
}

// ===== 剧情推演 =====
PAGES.forecast=async(p)=>{
  if(!S.book)return p.innerHTML=header('剧情推演','')+'<div class="content"><div class="warn-banner">请先在「我的创作」中打开一本作品。</div></div>';
  const book=await api('GET','/books/'+S.book);
  p.innerHTML=header('剧情推演','基于当前故事状态推演未来剧情走向：生成多个可能的分支方案',
    `<button class="btn btn-primary" id="forecast-run-btn" onclick="runForecast()">开始推演</button>`)+
  `<div class="content">
    <div class="card">
      <div class="card-title-row"><h3>推演配置</h3></div>
      <div class="grid grid-3">
        <div class="field"><label>分支数量</label><input class="input" id="fc-branches" type="number" value="3" min="1" max="5"></div>
        <div class="field"><label>当前章节</label><input class="input" id="fc-chapter" type="number" value="${book.chaptersWritten||0}" min="0"></div>
        <div class="field"><label>推演深度（章）</label><input class="input" id="fc-depth" type="number" value="3" min="1" max="10"></div>
      </div>
      <div class="field"><label>附加上下文（可选）</label><textarea class="input textarea" id="fc-context" placeholder="描述你希望探索的剧情方向、约束条件等..."></textarea></div>
    </div>
    <div id="forecast-result"></div>
  </div>`;
};
async function runForecast(){
  const btn=document.getElementById('forecast-run-btn');
  const out=document.getElementById('forecast-result');
  if(btn)btn.disabled=true;
  out.innerHTML='<div class="loading"><div class="spinner"></div>正在推演剧情走向…</div>';
  try{
    const branchCount=+(document.getElementById('fc-branches')?.value||3);
    const context=document.getElementById('fc-context')?.value||'';
    const queued=await api('POST','/books/'+S.book+'/forecast',{branchCount,context});
    const task=await waitForTask(queued.taskId,t=>{
      out.innerHTML=`<div class="card"><div class="loading"><div class="spinner"></div>推演中 ${t.stage||''}… ${t.total_steps?t.progress+'%':''}</div>
        <div class="progress mt8"><div class="progress-bar" style="width:${t.total_steps?t.progress:0}%"></div></div></div>`;
    });
    const result=task.result||{};
    const branches=result.branches||result.forecasts||[];
    if(!branches.length){
      out.innerHTML=`<div class="card"><h3>推演完成</h3><pre style="white-space:pre-wrap;font-size:13px">${esc(JSON.stringify(result,null,2))}</pre></div>`;
    }else{
      out.innerHTML=`<div class="card-title" style="margin:16px 0 12px">推演结果：${branches.length} 个分支方案</div>`+
      branches.map((b,i)=>`<div class="card" style="border-left:3px solid ${['var(--primary)','var(--accent)','var(--success)','var(--warning)','var(--error)'][i%5]}">
        <div class="card-title-row"><h3>分支 ${i+1}：${esc(b.title||b.name||'方案'+(i+1))}</h3>
          ${b.score!==undefined?`<span class="badge ${b.score>=80?'badge-success':b.score>=60?'badge-warning':'badge-error'}">评分 ${b.score}</span>`:''}</div>
        ${b.summary?`<p class="dim-note mb16">${esc(b.summary)}</p>`:''}
        ${b.plot_points?`<div class="mb16">${(b.plot_points||[]).map((pp,j)=>`<div class="list-row"><span class="badge badge-muted">${j+1}</span><span>${esc(typeof pp==='string'?pp:pp.description||pp.title||JSON.stringify(pp))}</span></div>`).join('')}</div>`:''}
        ${b.risks?`<div class="warn-banner" style="margin-top:8px">风险提示：${esc(typeof b.risks==='string'?b.risks:b.risks.join('；'))}</div>`:''}
        ${b.narrative?`<div style="margin-top:12px;line-height:1.8;font-size:14px">${esc(b.narrative)}</div>`:''}
      </div>`).join('');
    }
    toast('剧情推演完成','success');
  }catch(e){out.innerHTML=`<div class="warn-banner">${esc(e.message)}</div>`;}
  finally{if(btn)btn.disabled=false;}
}

// ===== 系统诊断 =====
PAGES.doctor=async(p)=>{
  const d=await api('GET','/doctor');
  const icon=s=>s==='ok'?'<span style="color:var(--success)">✔</span>':s==='warning'?'<span style="color:var(--warning)">⚠</span>':'<span style="color:var(--error)">✘</span>';
  p.innerHTML=header('系统诊断','检查模型配置、项目目录等运行环境',`<button class="btn btn-secondary" onclick="go('doctor')">重新检测</button>`)+
  `<div class="content"><div class="card"><table class="table"><tbody>
    ${(d.checks||[]).map(c=>`<tr><td style="width:40px">${icon(c.status)}</td><td><b>${esc(c.name)}</b></td><td class="text-muted">${esc(c.message)}</td></tr>`).join('')}
  </tbody></table></div></div>`;
};

renderNav();
initSSE();
go(S.book?S.page:'dashboard');
