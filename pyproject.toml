[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: isolated deterministic unit tests",
  "integration: public API and persistence-boundary tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
  "E501", # Long embedded prompts and Studio HTML.
  "E701", # Legacy compact callback declarations; behavior is covered by tests.
  "E741", # Legacy one-letter local names; no semantic ambiguity at runtime.
  "F403", # Package-level compatibility re-export.
  "F841", # Existing workflow calls retain values for debugger inspection.
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
